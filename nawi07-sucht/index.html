        for (let i = 0; i < n; i++) s += S.welle(x1 + i * (b + g), 266, TA);
        s += S.wort(m, 332, 'Atmung:', true) + S.wort(m, 362, atem, true);
      }
      return s;
    };
    t += feld(6, 'Belohnungssystem', true) + feld(306, 'Atemzentrum', false);
    return `<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Menge Stufe ${k}: im Belohnungssystem und im Atemzentrum je ${k} von 4 Opioid-Rezeptoren besetzt; Rausch ${rausch}; Atmung ${atem}, ${zuege} Atemzüge" ` +
      `data-kleinste="26" data-unterschrift="Ein Opioid an zwei Orten: Belohnungssystem und Atemzentrum, je vier Rezeptoren" data-vermerk="vereinfacht" data-ebene="Zelle">${t}</svg>`;

input.zahl:focus, .dialog input:focus { outline:3px solid var(--akzent); outline-offset:2px; }
.vergleich { display:flex; gap:12px; align-items:center; border:2px solid var(--pa); border-radius:12px; padding:8px 12px; margin-top:10px; }
.vergleich img { width:44px; height:44px; flex:none; }
.vergleich .titel { font-weight:700; color:var(--pa); }
.rueck { margin-top:10px; }
.rueck .meldung { padding:8px 14px; border-radius:12px; border:2px solid; }
.rueck .ok { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
.rueck .nein { background:var(--neinbg); color:var(--nein); border-color:var(--nein); }
.rueck .info { background:var(--flaeche); color:var(--text); border-color:var(--rand); }
.rueck .sym { font-weight:800; margin-right:4px; }
.hilfe { display:flex; flex-wrap:wrap; gap:10px; margin-top:calc(12px * var(--s, 1)); align-items:center; }
.hilfe .btn { padding:8px 12px; }
.hilfe .titel { font-size:18px; color:var(--grau); margin-right:2px; }
.hilfetext { display:grid; gap:8px; margin-top:10px; }
.hilfetext .stufe-box { border:2px solid var(--rand); border-radius:12px; padding:8px 14px; background:var(--flaeche); }
.loesung { border:2px solid var(--akzent); border-radius:12px; padding:10px 14px; margin-top:10px; display:grid; gap:8px; }
.loesung .teil b { color:var(--akzent-dunkel); }
.heftauftrag { border-left:8px solid var(--orange); background:var(--orangebg); border-radius:8px; padding:8px 12px; font-weight:600; }
/* V17: Heftstreifen – was wörtlich ins Heft kommt (in der Quelle in „…“), steht als eigener Block auf weißem Papier mit Linien (nicht Farbe allein: Rand und Linien).
   Was nicht auf einem Streifen steht, ist ein Auftrag. Die Linien liegen im Abstand der Zeilen (1.5), jede Zeile steht auf ihrer Linie. */
.heftwort { display:block; margin:3px 0 2px; padding:0 8px; background-color:#fff; border:1px solid #9aaab4; border-radius:4px; font-weight:400; color:var(--text); line-height:1.5;
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.5em - 2px), #b7c6cf calc(1.5em - 2px), #b7c6cf calc(1.5em - 1px), transparent calc(1.5em - 1px), transparent 1.5em); }
.zuordnen .opt.fest.links .mark { font-weight:700; }   /* V17: das Paar steht in einer Zeile – links genügt der Haken */
.codebox { margin-top:12px; border:3px solid var(--ok); background:var(--okbg); border-radius:14px; padding:10px 16px; text-align:center; }
.codebox .code { font-size:34px; font-weight:800; letter-spacing:.06em; color:var(--ok); word-break:break-all; line-height:1.3; }
.codebox .hint { font-size:18px; color:var(--text); }
.checkliste { display:grid; gap:10px; }
.check { min-height:52px; width:100%; text-align:left; padding:8px 14px; border:2px solid var(--rand); border-radius:12px; background:#fff; color:var(--text); line-height:1.35; }
.check .kaestchen { font-weight:700; margin-right:6px; }
.check.an { border-color:var(--ok); background:var(--okbg); }
ol.schritte { padding-left:26px; margin:0; } ol.schritte li { margin:6px 0; }
.vermutung .optionen { margin-top:6px; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
.vermutung .opt { text-align:center; padding:6px 8px; }
.vm-notiz { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.simbox { margin-top:8px; }
.simkopf { display:flex; flex-wrap:nowrap; gap:10px; align-items:center; }
.simlabel { white-space:nowrap; }
.simregler { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
input[type=range] { flex:1; min-width:60px; height:52px; -webkit-appearance:none; appearance:none; background:transparent; }
input[type=range]::-webkit-slider-runnable-track { height:10px; background:var(--rand); border-radius:5px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:44px; height:44px; border-radius:50%; background:var(--akzent); margin-top:-17px; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); }
.simsvg { width:100%; max-height:20vh; display:block; margin:2px auto; }
.simwerte { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.simout { font-size:24px; font-weight:700; }
.modellgrenze { color:var(--grau); margin-top:4px; }
/* Fuß */
footer.fuss { position:fixed; left:0; right:0; bottom:0; min-height:var(--fussh); background:#fff; border-top:2px solid var(--linie);
  display:flex; align-items:center; gap:12px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:5; }
footer .haupt { margin-left:auto; min-width:180px; font-size:22px; }
footer .meta { font-size:16px; color:var(--grau); }
/* Code-Dialog */
.dialog { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:20; padding:16px; }
.dialog .box { background:#fff; border-radius:16px; padding:18px 20px; max-width:520px; width:100%; display:grid; gap:12px; }
.dialog h2 { margin:0; font-size:26px; line-height:1.25; }
.dialog input { font-size:26px; min-height:56px; width:100%; padding:6px 12px; border:2px solid var(--rand); border-radius:10px; letter-spacing:.04em; }
.dialog .knoepfe { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; }
/* V16: Dialog „Auswerten“ – der letzte Code groß, darunter ein Zwischenstand (wenn es einen gibt) und die Meldung zum Senden */
.dialog .codebox { margin-top:0; }
.dialog .awzw { margin:0; }
.dialog .awzw b { letter-spacing:.04em; }
.dialog .awzeile { font-size:16px; color:var(--grau); overflow-wrap:anywhere; }
.unsichtbar { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
/* Vorlage V7: Arbeit am Bild – Stelle antippen, Zustände umschalten, Bildfolge, Bildantworten, Regler, Ablauf */
.umschalter { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
.umschalter > .btn { flex:1 1 130px; min-width:max-content; padding-left:10px; padding-right:10px; }   /* V10: ein Knopf ist nie schmaler als sein Wort; reicht die Zeile nicht, bricht der Umschalter um */
.btn.zustand.gewaehlt { background:var(--akzent); color:#fff; }
.bildwahl .bildbox { width:100%; margin-left:auto; margin-right:auto; overflow:visible; }
.bildflaeche svg { display:block; width:100%; height:auto; border-radius:10px; }
.kartenfeld { padding:6px 0 0 6px; display:grid; grid-template-columns:repeat(var(--n, 2), minmax(0, 1fr)); gap:10px; margin-left:auto; margin-right:auto; }
.opt.folgekarte, .opt.bildopt { position:relative; display:block; padding:6px; }
.bildkarte { display:block; border:1px solid var(--linie); border-radius:8px; overflow:hidden; background:#fff; }
.bildkarte svg { display:block; width:100%; height:auto; }
/* Buchstabe oder Platznummer sitzt auf der Ecke der Karte – so bleibt die ganze Höhe für das Bild (die linke obere Ecke der Zeichnung bleibt frei) */
.kartenmarke { position:absolute; left:-6px; top:-6px; min-width:40px; height:36px; line-height:32px; padding:0 8px; text-align:center; font-weight:800; background:#fff; border:2px solid var(--rand); border-radius:10px; }
.kartenmarke.platz { border-style:dashed; }
.folgekarte.paar .kartenmarke, .folgekarte.fest .kartenmarke { border-style:solid; border-color:currentColor; }
.opt.folgekarte .mark, .opt.bildopt .mark { display:block; float:none; margin:4px 0 0; text-align:center; font-weight:700; }   /* Rückmeldung als Zeile unter dem Bild – erst wenn es sie gibt */
.opt.folgekarte .mark:empty, .opt.bildopt .mark:empty { display:none; }
.hilfe .hinweiszeile { margin:0; flex:1 1 230px; }
.folgekarte.paar { border-color:var(--akzent); background:var(--akzentbg); }
.regler { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 12px; margin-bottom:10px; }
.regler #rStart { padding:8px 12px; }
.simtext:empty { display:none; }
.reglerwert { font-weight:700; text-align:center; min-width:9em; }
.loesung .bildbox { margin-bottom:4px; }
/* V8: Vorlesen steht in der Kopfzeile des Auftrags – so kostet der Knopf keine eigene Zeile */
.kopfzeile { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 12px; margin-bottom:4px; }
.kopfzeile h2 { margin:0; white-space:nowrap; }
.kopfzeile .btn { padding:4px 14px; }
/* Anordnungen, zwischen denen die Seite je Ansicht wählt (größtes Bild, das auf einen Bildschirm passt) */
.station.a-stapel { grid-template-columns:1fr !important; grid-template-rows:auto !important; grid-template-areas:"auftrag" "material" "pruef" !important; }
.station.a-zwei { grid-template-columns:minmax(0, .85fr) minmax(0, 1.15fr) !important; grid-template-rows:auto 1fr !important; grid-template-areas:"auftrag material" "pruef material" !important; }
@media (min-width:1000px) { .station.a-stapel .f-auftrag > .kasten { column-count:2; column-gap:32px; } .station.a-stapel .f-auftrag > .kasten > * { break-inside:avoid; } }
.station.b-stapel .beschriften { display:block; }
.station.b-stapel .beschriften .begriffe { grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.station.a-schmal { grid-template-columns:minmax(0, .55fr) minmax(0, 1.45fr) !important; }
/* V8: Modell, Film oder Regler in der Mitte bekommen bei drei Spalten die breite Spalte */
.station.a-mitte { grid-template-columns:minmax(0, .8fr) minmax(0, 1.4fr) minmax(0, .9fr) !important; }
.simwahl { grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }   /* drei Einstellungen stehen in einer Reihe, sobald die Spalte breit genug ist */
.simwahl .btn { padding:8px 6px; }
.regler { gap:10px 8px; } .regler #rStart { padding:8px 10px; } .reglerwert { min-width:8.5em; }
@media (max-width:759px) { .station.ohne-mat { grid-template-areas:"auftrag" "pruef"; } }
@media (min-width:760px) { .station.ohne-mat.zu-ordnen { grid-template-areas:"auftrag" "pruef"; } }
@media (min-width:1000px) { .station.ohne-mat.zu-ordnen { grid-template-rows:auto; grid-template-areas:"auftrag pruef"; } }
.station.ohne-mat.a-stapel { grid-template-areas:"auftrag" "pruef" !important; }
@media (min-width:700px) { .beschriften { grid-template-columns:minmax(0, 1fr) fit-content(38%); } }
/* Lösung mit Bild: in einer breiten Spalte stehen Bild und Text nebeneinander */
.f-pruef { container-type:inline-size; }
@container (min-width:620px) {
  .loesung.mitbild { grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); column-gap:16px; align-items:start; }
  .loesung.mitbild > * { grid-column:2; }
  .loesung.mitbild > .bildspalte { grid-column:1; grid-row:1 / span 6; width:100%; }
}
[hidden] { display:none !important; }
/* V8: Die Prüfspalte bekommt bei drei Spalten die Breite, wenn Rückmeldung und Code sonst nicht auf den Bildschirm passen */
.station.a-pruef { grid-template-columns:minmax(0, .8fr) minmax(0, .9fr) minmax(0, 1.4fr) !important; }
/* V8: Code-Kasten – Überschrift und Code stehen in einer Zeile, wenn die Spalte breit genug ist */
.codebox { display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; column-gap:14px; }
.codebox .hint { flex-basis:100%; }
/* V8: Hochformat mit Modell oder Film – die Prüfspalte rückt unter das Modell, wenn links kein Platz mehr ist */
.station.a-rechts { grid-template-columns:minmax(0, .9fr) minmax(0, 1.1fr) !important; grid-template-rows:auto 1fr !important; grid-template-areas:"auftrag material" "auftrag pruef" !important; }
/* V9: Bildzeile – Unterschrift, Vermerk, Ebene und Zeichenschlüssel einer Zeichnung stehen in Seitenschrift unter dem Bild (Spez_Zeichnungen).
   Die Zeile ist so breit wie ihr Text und steht mittig unter dem Bild. Bildkarten bekommen keine Bildzeile.
   Schrift: eine Nebenangabe wie der Buchverweis, kein Fließtext – zwei Pixel kleiner als die Grundschrift, Vermerk und Ebene vier Pixel kleiner (nie unter 16 px). */
.bildtext { width:fit-content; max-width:100%; margin:6px auto 0; display:grid; gap:2px; font-size:calc(var(--grund) - 2px); line-height:1.35; text-align:left; }
.bildtext .bu { display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px; }
.bildtext .bg { display:flex; flex-wrap:wrap; gap:2px 8px; }
.bildtext .bv { font-size:calc(var(--grund) - 4px); border:2px solid var(--rand); border-radius:8px; padding:0 8px; white-space:nowrap; }
.bildtext .bs { display:flex; align-items:center; gap:8px; }
.bildtext .bs svg { flex:none; display:block; overflow:visible; }
/* V9: Das Schild einer Marke („✓ passt“, der gewählte Begriff) fängt keinen Tipp ab – es darf eine Nachbarmarke berühren, ohne sie zu sperren */
.opt.marke .mark { pointer-events:none; }
/* Beschriften: Die Bildzeile läuft unter Bild und Begriffen durch – so bricht sie seltener um und das Bild behält die Höhe */
@media (min-width:700px) { .beschriften.mit-bildtext { row-gap:0; }
  .beschriften.mit-bildtext > .bildtext { grid-column:1 / -1; grid-row:2; justify-self:start; margin-left:0; margin-right:0; }
  .station.b-stapel .beschriften.mit-bildtext > .bildtext { margin-left:auto; margin-right:auto; } }
/* V15: Wörter zum Antippen. V16: ein kleiner Knopf mit Rand in der Zeile – Rand in der Akzentfarbe wie bei den anderen Knöpfen, dahinter ein kleiner Winkel (nicht Farbe allein).
   Der Knopf ist mit Rand so hoch wie die Zeile (26 px Zeilenhöhe + 2 × 2 px Rand = 30 px): Die Zeilen des Absatzes rücken nicht auseinander. Er ist 14 px breiter als das Wort –
   ein Absatz kann dadurch eine Zeile länger werden. Ein Ziel im Fließtext (WCAG 2.5.8, Ausnahme „Inline“);
   ein verfehlter Tipp löst nichts aus. Die Erklärung steht in einer Zeile direkt unter dem Absatz – kein Fenster über dem Text. */
.wort { -webkit-appearance:none; appearance:none; display:inline-block; padding:0 4px 0 6px; margin:0; border:2px solid var(--akzent); border-radius:8px; background:#fff; text-align:inherit; vertical-align:baseline;
  line-height:26px; -webkit-text-decoration:none; text-decoration:none; }
.wort::after { content:""; display:inline-block; width:.4em; height:.4em; margin:0 .15em .2em .3em; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); }
.wort[aria-expanded="true"] { background:var(--akzentbg); }
.wort[aria-expanded="true"]::after { transform:rotate(-135deg); }
.wort:focus-visible { outline:3px solid var(--akzent); outline-offset:2px; }
.worterkl { margin:6px 0 0; padding:6px 12px; border:2px dotted var(--rand); border-radius:10px; background:#fff; color:var(--text); font-weight:400; }
.frage + .worterkl { margin:0 0 calc(10px * var(--s, 1)); }
.loesung > .worterkl { margin:0; }
/* V15: Lückentext mit Wortspeicher – die Lücke ist eine Tippfläche in der Zeile (52 px hoch); die Zeilen stehen so weit auseinander, dass zwischen zwei Lücken mehr als 8 px frei bleiben */
.lueckentext { line-height:62px; margin:0 0 calc(10px * var(--s, 1)); }
.opt.luecke { display:inline-block; width:auto; max-width:100%; margin:0 4px; padding:6px 12px; vertical-align:middle; text-align:center; border-style:dashed; overflow-wrap:anywhere; }
.opt.luecke .mark { float:none; margin-left:6px; }
.opt.luecke .mark:empty { display:none; }
.opt.luecke.fest { border-style:solid; }
.lueckentext .opt.paar, .wortspeicher .opt.paar { border-style:solid; border-color:var(--akzent); background:var(--akzentbg); }
.lueckentext .opt.aktiv, .wortspeicher .opt.aktiv { border-style:solid; border-color:var(--orange); box-shadow:inset 0 0 0 1px var(--orange); }
.wortspeicher { display:flex; flex-wrap:wrap; gap:10px; padding:10px; border:2px dashed var(--rand); border-radius:12px; background:var(--flaeche); }
.wortspeicher .opt { width:auto; min-width:52px; text-align:center; }
/* V16: Modellrahmen – ein Modell aus den Bausteinen (MODELLE) bekommt von der Seite Bedienung, Stand, Bild, Diagramm und Messtabelle.
   Größen stellt man mit Minus und Plus ein (52 px, kein Ziehen), bei höchstens drei benannten Werten mit einem Umschalter. Bild, Diagramm und Tabelle
   stehen im Modellfeld: Die Seite wählt, ob sie nebeneinander oder untereinander stehen (data-form), und passt das Feld wie ein Bild auf den Bildschirm ein.
   Die Bildzeile (Unterschrift, Vermerk, Ebene, Zeichen) steht im Feld direkt unter dem Bild: bei einer Spalte unter dem Bild, sonst unter der Reihe mit dem Bild.
   Es gibt sie zweimal, zu sehen ist eine: untereinander im Feld gleich nach dem Bild, nebeneinander unter dem Feld – so breit wie der Kasten (schrumpft das Feld, braucht sie nicht mehr Zeilen).
   Die Tabelle rollt in ihrem Feld, ihr Kopf bleibt stehen; die neueste Zeile ist hervorgehoben (fett und mit Fläche – nicht durch Farbe allein). */
.modell h2 { margin-bottom:6px; }
.mkopf { display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; }   /* Größen und Tasten des Ablaufs teilen sich eine Zeile, wenn beide hineinpassen (feste Größe, „Auf Start“ allein) – sonst stehen sie untereinander */
.mkopf > .mgroessen, .mkopf > .mlauf { flex:1 1 auto; min-width:0; }
.mkopf > .mlauf { margin-top:0; }
.mgroessen { display:grid; gap:8px; }
.mgroesse { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.mgroesse .mname { flex:1 1 auto; font-weight:600; }   /* so breit wie das Wort – eine feste Mindestbreite ließe die Zeile umbrechen, wenn sie sich die Reihe mit „Auf Start“ teilt */
.mgroesse .mwert { min-width:4.6em; text-align:center; font-weight:700; }
.mgroesse.fest { gap:0 8px; }
.mgroesse.fest .mname { flex:0 1 auto; }
.mgroesse.fest .mwert { min-width:0; text-align:left; }
.mgroesse .btn[aria-disabled="true"] { background:#fff; color:var(--grau); border-color:var(--linie); border-style:dashed; }
.mgroesse .mwahl { display:flex; flex-wrap:wrap; gap:8px; }
.mgroesse .mwahl .btn { padding:8px 12px; }
.mgroesse .mwahl .btn.gewaehlt { background:var(--akzent); color:#fff; }
.mlauf { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; }
.mlauf .btn { padding:8px 12px; }
.mlauf .mrechts { margin-left:auto; }
.mende { font-weight:600; min-height:52px; display:flex; align-items:center; }
.mstandzeile { display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin-top:8px; }   /* der Stand, daneben „Erwartung zeigen“ – passt beides nicht in eine Zeile, steht die Taste darunter */
.mstand { flex:1 1 auto; margin:0; font-weight:700; }   /* so breit wie ihr Text: Passt die Taste nicht daneben, rückt die Taste in die nächste Zeile – nicht der Text */
.mstand:empty { display:none; }
.mstandzeile .mzusatz { margin:0 0 0 auto; }
.mhinweis { margin:4px 0 0; color:var(--text); border-left:8px solid var(--akzent); padding-left:10px; }
.mhinweis:empty { display:none; }
.modellfeld { display:grid; gap:10px; grid-template-columns:minmax(0, 1fr); align-items:start; margin:8px auto 0; }
.modellfeld[data-form="2"] { grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr); }
.modellfeld[data-form="2"][data-teile="bt"] { grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); }
.modellfeld[data-form="2"][data-teile="bdt"] .mtab { grid-column:1 / -1; }
.modellfeld[data-form="3"] { grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, .85fr); }
.mteil { border:2px solid var(--linie); border-radius:12px; background:#fff; overflow:hidden; min-width:0; }
.mteil svg { display:block; width:100%; height:auto; }
.mtab { position:relative; align-self:stretch; min-height:calc(var(--mz, 4) * var(--mzh, 31px) + var(--mzk, 34px)); }
.mrollen { position:absolute; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; }
.mtabelle { border-collapse:separate; border-spacing:0; width:100%; line-height:1.3; }
.mtabelle th, .mtabelle td { padding:2px 10px; text-align:right; border-bottom:1px solid var(--linie); }
.mtabelle td { white-space:nowrap; }
.mtabelle th { position:sticky; top:0; z-index:1; background:var(--flaeche); font-weight:700; border-bottom:2px solid var(--rand); }
.mtabelle tbody tr:last-child td { font-weight:700; background:var(--akzentbg); }
.mtabelle .mleer td { text-align:left; white-space:normal; font-weight:400 !important; background:#fff !important; color:var(--grau); }
.modellfeld > .mzeile { grid-column:1 / -1; margin-top:-4px; }
.mzeile.mleg { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2px 18px; }
.mzeile.mleg .bu { justify-content:center; }
.modellfeld[data-form="2"] > .mbild, .modellfeld[data-form="3"] > .mbild { order:1; }
.modellfeld[data-form="2"] > .mdia, .modellfeld[data-form="3"] > .mdia, .modellfeld[data-form="2"] > .mtab, .modellfeld[data-form="3"] > .mtab { order:2; }
.modellfeld[data-form="2"] > .mzeile { order:3; }
.modellfeld[data-form="2"][data-teile="bdt"] > .mtab { order:4; }
.modellfeld[data-form="2"]:not([data-teile="bdt"]) > .mzeile, .modellfeld[data-form="3"] > .mzeile, .modellfeld[data-teile="b"] > .mzeile { display:none; }   /* Teile nebeneinander oder nur das Bild: Die Zeile steht unter dem Feld */
.modellfeld[data-form="1"]:not([data-teile="b"]) + .mzeile, .modellfeld[data-form="2"][data-teile="bdt"] + .mzeile { display:none; }   /* untereinander oder Tabelle in eigener Reihe: Die Zeile steht im Feld, gleich nach dem Bild */
.mzeile[hidden] { display:none !important; }
.mzusatz { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.mzusatz:empty { display:none; }
.mzusatz .btn { padding:8px 12px; }
.mzusatz .btn[aria-pressed="true"] { background:var(--akzent); color:#fff; }
.modellfehler { border:2px solid var(--nein); background:var(--neinbg); color:var(--nein); border-radius:12px; padding:8px 14px; font-weight:600; }
.standziel { margin:0 0 calc(10px * var(--s, 1)); padding:8px 14px; border:2px solid var(--ok); border-radius:12px; background:var(--okbg); color:var(--ok); }
.standziel:empty { display:none; }
/* V16: Tafelseite – dasselbe Modell als eigene Seite für die digitale Tafel: größere Schrift und Tasten, Bild, Diagramm und Tabelle nebeneinander, alles auf einem Bildschirm */
body.tafel { --grund:26px; --mzh:38px; --mzk:42px; }
body.tafel header.kopf { position:static; }
body.tafel header.kopf h1 { font-size:34px; }
body.tafel main { padding:12px 20px 16px; }
body.tafel .btn { min-height:64px; min-width:64px; }
body.tafel .btn.klein { width:64px; font-size:34px; }
body.tafel .tafelkopf { display:flex; flex-wrap:wrap; align-items:center; gap:10px 28px; }
body.tafel .tafelkopf .mgroessen { flex:0 1 auto; display:flex; flex-wrap:wrap; gap:10px 28px; }
body.tafel .tafelkopf .mlauf, body.tafel .tafelkopf .mzusatz { margin-top:0; }
body.tafel .tafelkopf .mlauf .mrechts { margin-left:0; }
body.tafel .mstandzeile { margin-top:10px; }
body.tafel .mstand { font-size:30px; }
body.tafel .mhinweis { font-size:24px; }
body.tafel .modellfeld { gap:16px; margin-top:12px; }
body.tafel .modellfeld[data-form="3"] { grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, .6fr); }
body.tafel .mteil svg * { vector-effect:none; }   /* an der Tafel wächst der Strich mit dem Bild (wie im Profil Standbild) – auf dem iPad bleibt er in Bildschirm-Pixeln fest */
body.tafel .mzeile .bs svg { width:42px; height:30px; }
body.tafel .mtabelle { line-height:1.25; }
body.tafel .mzeile { font-size:22px; }
body.tafel .modellfeld > .mzeile { margin-top:-6px; }
body.tafel .modellfeld + .mzeile { margin-top:10px; }
body.tafel .modellgrenze { font-size:24px; margin-top:8px; color:var(--text); }
/* niedriges Fenster (Surface mit den Leisten des Browsers, Beamer mit 720 Zeilen): alles eine Stufe kleiner – an der Tafel bleibt die Schrift im Verhältnis zum Bild etwa gleich groß */
@media (max-height:800px) {
  body.tafel { --grund:22px; --mzh:33px; --mzk:37px; }
  body.tafel header.kopf h1 { font-size:28px; }
  body.tafel main { padding:8px 16px 10px; }
  body.tafel .btn { min-height:56px; min-width:56px; }
  body.tafel .btn.klein { width:56px; font-size:30px; }
  body.tafel .mstandzeile { margin-top:6px; }
  body.tafel .mstand { font-size:25px; }
  body.tafel .mhinweis, body.tafel .modellgrenze { font-size:20px; }
  body.tafel .modellfeld { gap:12px; margin-top:8px; }
  body.tafel .mzeile { font-size:19px; }
  body.tafel .modellfeld > .mzeile { margin-top:-4px; }
  body.tafel .modellfeld + .mzeile { margin-top:8px; }
}
</style>

    const name = L.tafel.modell, f = modellFehler(name), M = MODELLE_[name];
    document.body.classList.add('tafel');
    const o = { tafel: true, erwartung: !!(M && M.erwartung && M.achsen), zeigt: null, fest: null, start: null };
    const zusatz = f ? '' : `${o.erwartung ? '<button class="btn sekundaer" id="mErw" aria-pressed="false">Erwartung zeigen</button>' : ''}${M.grenze ? '<button class="btn sekundaer" id="mGrenze" aria-pressed="false">Grenze des Modells</button>' : ''}`;
    app.innerHTML = `<header class="kopf"><h1>${esc(f ? L.titel : (M.titel || L.titel))}</h1><span class="typ">Modell für die Tafel</span><span class="thema">${esc(L.version || '')}</span></header>
      <main>${modellHtml(name, o, zusatz)}${!f && M.grenze ? `<p class="modellgrenze" id="mGrenzText" role="status" aria-live="polite" hidden>Grenze des Modells: ${md(M.grenze)}</p>` : ''}</main>`;
    if (f) return;
    const R = { g: {}, z: null, mess: [], erw: false, a: {} }; M.groessen.forEach(q => { R.g[q.id] = gStart(q, null); }); modellNeu(M, R);
    modellJetzt = modellBinde(app.querySelector('.modell'), name, R, o, () => {});
    const bg = app.querySelector('#mGrenze'), gt = app.querySelector('#mGrenzText');
    if (bg) bg.addEventListener('click', () => { gt.hidden = !gt.hidden; bg.setAttribute('aria-pressed', !gt.hidden); tafelPasse(); });
    tafelPasse();
  }

  /* ---------- Bildzeile (V9) ----------
     Eine Zeichnung nennt ihre Unterschrift, ihren Vermerk und ihre Ebene (data-unterschrift, data-vermerk, data-ebene am Bild; mehrere Vermerke mit „|“)
     und den Text zu jedem Zeichen, das kein Abbild ist (data-schluessel am Zeichen). Die Seite setzt daraus die Bildzeile in Seitenschrift unter das Bild:
     Ihre Schrift bleibt gleich groß, wenn das Bild wächst oder schrumpft. Das Zeichen im Schlüssel ist eine Kopie aus der Zeichnung.
     Eine Zeichnung ohne diese Angaben bekommt keine Bildzeile; Bildkarten bekommen nie eine. */
  function zeichenKopie(el) {
    const NS = 'http://www.w3.org/2000/svg', m = document.createElementNS(NS, 'svg'), g = document.createElementNS(NS, 'g'), k = el.cloneNode(true);
    k.removeAttribute('data-schluessel');
    m.setAttribute('width', 10); m.setAttribute('height', 10); m.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
    g.appendChild(k); m.appendChild(g); document.body.appendChild(m);
    let b = null; try { b = g.getBBox(); } catch (e) {}
    m.remove();
    if (!b || !(b.width > 0) || !(b.height > 0)) return '';
    const r = 2, w = b.width + 2 * r, h = b.height + 2 * r, f = Math.min(28 / h, 56 / w);   // 2 Einheiten Rand für den Strich; höchstens 28 px hoch und 56 px breit
    return `<svg viewBox="${b.x - r} ${b.y - r} ${w} ${h}" width="${Math.round(w * f)}" height="${Math.round(h * f)}" aria-hidden="true">${k.outerHTML}</svg>`;
  }
  function bildzeileHtml(svg) {
    const d = svg.dataset, teile = [], gesehen = new Set();
    const marken = liste(d.vermerk).map(v => `<span class="bv">${esc(v)}</span>`).join('') + (d.ebene ? `<span class="bv">Ebene: ${esc(d.ebene)}</span>` : '');
    const kopf = (d.unterschrift ? `<span>${esc(d.unterschrift)}</span>` : '') + (marken ? `<span class="bg">${marken}</span>` : '');   // Vermerk und Ebene bleiben beisammen
    if (kopf) teile.push(`<div class="bu">${kopf}</div>`);
    svg.querySelectorAll('[data-schluessel]').forEach(el => { const t = el.dataset.schluessel.trim(); if (!t || gesehen.has(t)) return; gesehen.add(t);
      teile.push(`<div class="bs">${zeichenKopie(el)}<span>${esc(t)}</span></div>`); });
    return teile.join('');
  }
  function bildzeilen() {
    app.querySelectorAll('.bildbox').forEach(box => {
      const svg = box.querySelector(':scope > svg:not(.linien), :scope > .bildflaeche > svg');
      const von = svg ? [svg.dataset.unterschrift, svg.dataset.vermerk, svg.dataset.ebene].concat([...svg.querySelectorAll('[data-schluessel]')].map(e => e.dataset.schluessel)).map(x => x || '').join('¦') : '';
      let bt = box.nextElementSibling; if (bt && !bt.classList.contains('bildtext')) bt = null;
      if (!von.replace(/¦/g, '')) { if (bt) { bt.remove(); box.parentElement.classList.remove('mit-bildtext'); } return; }
      if (bt && bt.dataset.von === von) return;   // unverändert
      if (!bt) { bt = document.createElement('div'); bt.className = 'bildtext'; box.after(bt); box.parentElement.classList.add('mit-bildtext'); }
      bt.dataset.von = von; bt.innerHTML = bildzeileHtml(svg);
    });
  }

  /* ---------- Anpassen an den Bildschirm ----------
     Ziel: eine Station = ein Bildschirm, hoch wie quer. Reihenfolge: 1. Bild, Modell und Film wachsen oder schrumpfen auf den freien Platz,
     2. reicht das nicht, werden die Abstände enger (--s). Schrift (20 px) und Tippflächen (52 px) ändern sich nie.
     V13 – fester Platz: Die Anordnung wird je Ansicht und Bildschirmgröße einmal gewählt – am Start. Danach bleibt jeder Bereich an seinem Platz,
     und kein Bild wird größer als am Start: Kommt etwas dazu (Rückmeldung, Tipp, Lösungsweg, Hefteintrag, Code), geben Bild und Abstände nach;
     reicht das nicht, rollt die Seite (Entscheidung der Lehrkraft 15.11.2026, 13:25). Neu gewählt wird nur, wenn eine neue Teilansicht beginnt:
     nach „Erst schreiben“ erscheinen die Antworten, der Film wird geladen, der Code erscheint mit der Übersicht der Station, das Gerät
     wird gedreht (gedreht und zurückgedreht steht wieder dieselbe Anordnung). Am Start wählt die Seite wie bisher: die Anordnung mit den
     größten Bildern, die auf einen Bildschirm passt.
     V13 – untere Leiste und Nachrollen: Der freie Platz unter dem Inhalt ist so hoch wie die Leiste (--leiste; sie wird höher, wenn ihre Knöpfe auf
     einem schmalen Bildschirm umbrechen oder das Gerät unten einen Rand hat) – auch am Ende des Rollens liegt nichts hinter ihr. Was neu erscheint,
     rollt ins Bild: so weit, bis sein Ende über der Leiste steht; sein Anfang bleibt unter dem Kopf. */
  const MEDIUM_MIN = 150;   // px Höhe: kleiner wird kein Bild und kein Film
  let leisteEl = null, rollZiel = null;
  const leisteRO = window.ResizeObserver ? new ResizeObserver(() => { if (leisteMessen()) planeAnpassen(); }) : null;
  function leisteMessen() {   // Höhe der unteren Leiste als --leiste; true, wenn sie sich geändert hat
    const f = app.querySelector('footer.fuss'); if (!f) return false;
    if (f !== leisteEl) { leisteEl = f; if (leisteRO) { leisteRO.disconnect(); leisteRO.observe(f); } }
    const h = Math.ceil(f.getBoundingClientRect().height) + 'px', w = document.documentElement.style;
    if (w.getPropertyValue('--leiste') === h) return false;
    w.setProperty('--leiste', h); return true;
  }
  function zeige(von, bis) { if (von) { rollZiel = [von, bis || von]; planeAnpassen(); } }   // nach dem nächsten Anpassen ins Bild rollen: von … bis
  function rolle() {
    if (!rollZiel) return; const [von, bis] = rollZiel; rollZiel = null;
    if (!von.isConnected) return;
    const fuss = app.querySelector('footer.fuss'), kopf = app.querySelector('header.kopf');
    const oben = (kopf ? Math.max(0, kopf.getBoundingClientRect().bottom) : 0) + 8, unten = (fuss ? fuss.getBoundingClientRect().top : window.innerHeight) - 8;
    let a = von.getBoundingClientRect(), b = bis.isConnected ? bis.getBoundingClientRect() : a;
    if (!a.height && !b.height) return; if (!a.height) a = b; if (!b.height) b = a;   // Verborgenes zählt nicht
    const anfang = Math.min(a.top, b.top), ende = Math.max(a.bottom, b.bottom);
    let d = 0;
    if (ende > unten) d = ende - unten;          // nach unten rollen, bis das Ende über der Leiste steht …
    if (anfang - d < oben) d = anfang - oben;    // … der Anfang bleibt unter dem Kopf
    if (Math.abs(d) > 1) window.scrollBy({ top: d, behavior: 'smooth' });
  }
  function neuWaehlen() { const st = app.querySelector('.station'); if (st) { st.dataset.anordnung = ''; st.dataset.s = ''; st._wahl = null; } }   // eine neue Teilansicht beginnt
  function passeAn() {
    leisteMessen();
    const st = app.querySelector('.station'); if (!st) { tafelPasse(); return; }   // V16: die Tafelseite passt ihr Modellfeld selbst ein
    bildzeilen();
    const fuss = app.querySelector('footer.fuss'), medien = [...st.querySelectorAll('.bildbox, .videobox iframe, .kartenfeld, .modellfeld')];
    const haupt = app.querySelector('main'), polster = haupt ? parseFloat(getComputedStyle(haupt).paddingBottom) || 0 : 0;
    const frei = () => window.innerHeight - Math.max(polster, fuss ? fuss.offsetHeight : 0) - 2;   // Unterkante des Inhalts darf die Fußleiste nicht erreichen
    const unten = el => el.getBoundingClientRect().bottom + window.scrollY;
    const passe = () => {   // Größen für die gewählte Anordnung
      const eineSpalte = getComputedStyle(st).gridTemplateColumns.trim().split(/\s+/).length < 2;
      st.style.setProperty('--s', +st.dataset.s || 1); medien.forEach(e => { e.style.maxWidth = e.dataset.start ? e.dataset.start + 'px' : ''; });   // V13: nie größer und nie weiter als zuletzt in dieser Ansicht
      const medienAn = () => { for (let runde = 0; runde < 8; runde++) {
        let bewegt = false;
        for (const e of medien) {
          const spalte = eineSpalte ? st : (e.closest('.f-material, .f-pruef') || st);
          const d = frei() - unten(spalte); if (Math.abs(d) < 3) continue;
          const r = e.getBoundingClientRect(); if (!r.height) continue;
          const platz = Math.min(e.parentElement.getBoundingClientRect().width, +e.dataset.start || 1e5), vorher = unten(spalte);
          const kl = e.querySelector ? e.querySelector('svg[data-kleinste]') : null;   // kleinste Schrift im Bild: mindestens 16 px auf dem Bildschirm
          const minSchrift = kl ? 16 / +kl.dataset.kleinste * (kl.viewBox.baseVal.width || 600) + 6 : 0;   // + Rand der Bildbox
          const minKarten = e.classList.contains('kartenfeld') ? (+getComputedStyle(e).getPropertyValue('--n') || 2) * 150 : 0;
          const minModell = e.classList.contains('modellfeld') ? modellMin(e) : 0;   // V16: jedes Teil des Modellfelds behält seine Mindestbreite
          const breit = Math.min(platz, Math.max(minSchrift, minKarten, minModell, Math.max(MEDIUM_MIN, r.height + d) * r.width / r.height));
          if (Math.abs(breit - r.width) < 2) continue;
          e.style.maxWidth = breit + 'px';
          if (d < 0 && Math.abs(unten(spalte) - vorher) < 1) { e.style.maxWidth = r.width + 'px'; continue; }   // Schrumpfen hilft dieser Spalte nicht
          bewegt = true;
        }
        if (!bewegt) break; } };
      medienAn();
      for (const s of [0.85, 0.7, 0.55]) { if (frei() - unten(st) >= -2) break; if (s >= (+st.dataset.s || 1)) continue; st.style.setProperty('--s', s); medienAn(); }
    };
    // V13 – Sperre: Bild und Abstände geben in einer Ansicht nur nach, sie kommen nicht zurück. Ein Bild, das wieder wächst, sobald Tipps oder
    // Rückmeldung weichen, schöbe den Prüfbereich darunter nach unten. Gemerkt wird die kleinste Breite je Bild und die engste Abstandsstufe.
    const merke = () => {
      medien.forEach(e => { const b = e.getBoundingClientRect().width; if (b && !(+e.dataset.start <= b)) e.dataset.start = b; });
      st.dataset.s = st.style.getPropertyValue('--s') || 1;
    };
    // Anordnung: nebeneinander, zwei Spalten oder gestapelt – und wie viele Bildkarten in einer Reihe. Gewählt wird einmal je Ansicht und
    // Bildschirmgröße die Anordnung mit den größten Bildern, die auf einen Bildschirm passt. Danach ändern sich nur noch die Größen.
    const groesse = window.innerWidth + 'x' + window.innerHeight;
    if (st.dataset.anordnung === groesse) { passe(); merke(); return; }   // V13: schon gewählt – die Anordnung bleibt, auch wenn der Inhalt länger wird als der Bildschirm
    const karten = [...st.querySelectorAll('.kartenfeld[data-wahl]')];
    const mfeld = st.querySelector('.modellfeld[data-wahl]'), mformen = mfeld ? mfeld.dataset.wahl.split(',') : [''];   // V16: Formen des Modellfelds – Teile nebeneinander oder untereinander
    const setze = (a, n, b, m) => { st.classList.remove('a-stapel', 'a-zwei', 'a-schmal', 'a-mitte', 'a-pruef', 'a-rechts', 'b-stapel'); if (a) st.classList.add(a); if (b) st.classList.add(b); if (n) karten.forEach(k => k.style.setProperty('--n', n)); if (mfeld && m) { mfeld.dataset.form = m; mfeld.style.removeProperty('--mz'); } };
    const merk = st._wahl || (st._wahl = {}), war = merk[groesse];   // V13: je Bildschirmgröße einmal gewählt – nach Drehen und Zurückdrehen steht wieder dieselbe Anordnung
    if (war) { setze(war.a, war.n, war.b, war.m); if (mfeld && war.mz > 4) mfeld.style.setProperty('--mz', war.mz); medien.forEach((e, i) => { if (war.start[i]) e.dataset.start = war.start[i]; else delete e.dataset.start; }); st.dataset.s = ''; passe(); merke(); modellRolle(); st.dataset.anordnung = groesse; return; }
    medien.forEach(e => { delete e.dataset.start; }); st.dataset.s = '';
    let wahl = { a: '', n: 0, b: '', m: '' };
    if (medien.length || frei() - unten(st) < -2) {
      setze('');
      const spalten = getComputedStyle(st).gridTemplateColumns.trim().split(/\s+/).length;
      const modell = st.classList.contains('sim');   // Modell, Film, Regler, Ablauf oder Bilder zum Umschalten stehen in der Materialspalte
      const anordnungen = [''].concat(spalten > 2 || (spalten === 2 && modell) ? ['a-zwei'] : [], spalten === 3 && modell ? ['a-mitte'] : [], spalten === 3 ? ['a-pruef'] : [], spalten === 2 && modell ? ['a-rechts'] : [], spalten === 2 && window.innerWidth >= 1000 ? ['a-schmal'] : [], spalten > 1 ? ['a-stapel'] : []);
      const zahlen = karten.length ? karten[0].dataset.wahl.split(',').map(Number) : [0];
      const innen = st.querySelector('.beschriften') ? ['', 'b-stapel'] : [''];   // Begriffe neben oder unter dem Bild
      let best = null;
      for (const a of anordnungen) for (const n of zahlen) for (const b of innen) for (const m of mformen) {
        setze(a, n, b, m); passe();
        const lesbar = medien.every(e => { if (e.classList.contains('modellfeld')) return modellOk(e); const kl = e.querySelector ? e.querySelector('svg[data-kleinste]') : null; return !kl || +kl.dataset.kleinste * kl.getBoundingClientRect().width / (kl.viewBox.baseVal.width || 600) >= 15.9; });   // Schrift im Bild bleibt lesbar
        const passt = lesbar && frei() - unten(st) >= -2 && document.scrollingElement.scrollWidth <= window.innerWidth + 2;
        const eng = (+st.style.getPropertyValue('--s') || 1) < 1 ? 0.9 : 1;   // enge Abstände nur, wenn das Bild dadurch deutlich größer wird
        const mass = eng * Math.min(...medien.map(e => { const b = e.classList.contains('kartenfeld') ? e.querySelector('.bildkarte') : e.classList.contains('modellfeld') ? e.querySelector('.mbild') : e; return b ? b.getBoundingClientRect().width : 1e4; }));
        const ueber = Math.max(0, unten(st) - frei());   // passt keine Anordnung, gewinnt die mit dem kleinsten Überstand – nicht die mit dem größten Bild
        if (!best || (passt && !best.passt) || (passt && best.passt && mass > best.mass * 1.08) || (!passt && !best.passt && (lesbar && !best.lesbar || lesbar === best.lesbar && ueber < best.ueber - 4))) best = { a, n, b, m, passt, mass, ueber, lesbar };   // V13: passt keine, geht lesbare Schrift im Bild vor
      }
      setze(best.a, best.n, best.b, best.m); wahl = best;
    }
    passe();
    const mz = mfeld ? modellZeilen(mfeld, frei() - unten(getComputedStyle(st).gridTemplateColumns.trim().split(/\s+/).length < 2 ? st : (mfeld.closest('.f-material, .f-pruef') || st))) : 0; modellRolle();   // V16: übriger Platz geht an die Messtabelle – ihre neueste Zeile bleibt zu sehen
    medien.forEach(e => { const b = e.getBoundingClientRect().width; if (b) e.dataset.start = b; });   // V13: so groß wie jetzt wird kein Bild mehr
    merk[groesse] = { a: wahl.a, n: wahl.n, b: wahl.b, m: wahl.m, mz, start: medien.map(e => e.dataset.start) };
    st.dataset.s = st.style.getPropertyValue('--s') || 1;
    st.dataset.anordnung = groesse;
  }
  let anpassenGeplant = 0;
  function planeAnpassen() { cancelAnimationFrame(anpassenGeplant); anpassenGeplant = requestAnimationFrame(() => { passeAn(); rolle(); }); }
  new MutationObserver(planeAnpassen).observe(app, { childList: true, subtree: true });
  window.addEventListener('resize', planeAnpassen); window.addEventListener('orientationchange', planeAnpassen);

  const start = L.stationen.find(x => x.nr === zustand.aktuell);
  if (L.tafel) zeigeTafel(); else if (start && istFrei(start)) zeigeStation(start); else zeigeKarte();
})();
</script>
</body>
</html>
