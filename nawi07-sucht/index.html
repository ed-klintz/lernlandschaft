  // Vorbild für Ansicht und Proportionen: NIDA „Dopamine pathways“ (gemeinfrei); Rückenmark nach NCI „Brain and Nearby Structures“ (gemeinfrei).
  // Der Umriss ist neu gezeichnet, nicht durchgepaust. Hirnstamm nach Buch S. 149: Mittelhirn, Brücke, verlängertes Rückenmark – eine Form,
  // die Brücke als Bauch nach vorn. Das Kleinhirn liegt unter dem hinteren Ende des Großhirns und schließt den Umriss des Gehirns nach hinten.
  // Angaben: schrift = nein (keine Wörter an den Teilen – für „Stelle im Bild“) · teile (Großhirn, Kleinhirn, Hirnstamm, Rückenmark) ·
  //          orte (drei von mehreren Orten mit Opioid-Rezeptoren: Belohnungssystem, Atemzentrum im Hirnstamm, Schmerzbahn im Rückenmark) ·
  //          belohnung (Version 6: die Teile mit ihren Wörtern, ohne Marke und ohne Text im Schlüssel – Lehrkraft 15.11.2026, 22:41; Station 1 handelt
  //          nicht von Rezeptoren); dazu an = nein | ja (nur bei belohnung): bei ja springt das Belohnungssystem an – acht kurze Striche um die Stelle
  //          (Hervorhebung, Regel 24) – und wort = nein | ja (nur bei belohnung, Version 6): bei ja steht das Wort „Belohnungssystem“ mit Hinweislinie,
  //          Punkt an der Stelle (156|140) – nur im Lösungsbild: Vorher soll das Bild den Ort nicht nennen.
  //          Lage bei belohnung: „Großhirn“ auf Höhe 60 (Linie zu 285|62) in jedem Zustand, „Belohnungssystem“ auf Höhe 95 wie bei orte – tiefer läge die
  //          Linie zu nah am Hirnstamm (gemessen); die Striche stehen zwischen 55° und 320° (0° = rechts), rechts bleibt Platz für Hinweislinie und Hirnstamm.
  // Die Zeichnung ist in jedem Zustand 600 × 380 Einheiten groß. Unterschrift, Vermerk, Ebene und Zeichenschlüssel zeichnet sie nicht selbst:
  // Sie nennt die Texte (data-unterschrift, data-vermerk, data-ebene am Bild; data-schluessel am Zeichen), die Vorlage setzt sie in
  // Seitenschrift unter das Bild.
  // Jeder Bildteil trägt seinen Namen (data-teil): umriss · innen · hinweis · hinweis-punkt · marke · wort. Die Form mit Bedeutung (die Nut in der Marke)
  // trägt data-form="passung"; nur sie hat spitze Ecken (Spez_Zeichnungen, Regel 32).
  // Striche in Bildschirm-Pixeln, sie wachsen nicht mit dem Bild: dünn 1,8 · mittel 2,6 · dick 3,6. Schrift: eine Größe, 26 Einheiten – das sind
  // 16 px in der kleinsten Anordnung der Vorlage (Bild 375 px breit). Farben: Linie #1d2a3a, Schnittfläche #e8ebef, Weiß.
  // Lage (Einheiten = Stelle im Bild): Großhirn (120|104) · Hirnstamm, Brücke (212|220) · Kleinhirn (292|212) · Marken: Belohnungssystem (156|140) ·
  // Atemzentrum (244|268) · Schmerzbahn (245|344). Prozentwerte für Marken der Seite: x durch 6, y durch 3,8. Marken der Seite stehen neben dem Teil
  // und zeigen mit einer Linie darauf; zwei Marken liegen im kleinsten Bild mindestens 62 px auseinander (Spez_Lernlandschaft, Abschnitt 6).
  gehirn(p) {
    const s = p.schrift === false ? 'nein' : (p.schrift || 'nein');
    const TON = S.TON, dick = S.dick, duenn = S.duenn;                        // Werte aus dem Block der Bibliothek (Profil Bildschirm)
    const mittel = `fill="none" ${S.mittel}`, eckig = `fill="none" ${S.eckig}`;   // Linien ohne Füllung; eckig = mittel mit spitzen Ecken, nur für die Nut
    const umriss = (name, d) => `<path data-teil="umriss" data-name="${name}" fill="${TON}" ${dick} d="${d}"/>`;
    const innen = (name, ds) => `<g data-teil="innen" data-name="${name}">${ds.map(d => `<path d="${d}" ${mittel}/>`).join('')}</g>`;
    const wort = (x, y, t) => S.wort(x, y, t), hin = S.hin.bind(S);             // Wort und Hinweislinie aus dem Block
    // Marke für einen Ort mit Opioid-Rezeptoren: Rahmen, darin die eckige Nut. Die Nut ist in der ganzen Sequenz das Zeichen für den Rezeptor (das Schloss);
    // sie ist die einzige Form mit spitzen Ecken – die Form trägt die Bedeutung „hier passt etwas genau hinein“ und hebt sich deshalb vom runden Stil ab.
    const marke = (x, y) => `<g data-teil="marke" data-schluessel="Opioid-Rezeptoren: drei von mehreren Orten"><rect x="${x - 17}" y="${y - 17}" width="34" height="34" rx="7" fill="#fff" ${duenn}/>` +
      `<path data-form="passung" d="M${x - 7} ${y - 7} V${y + 6} H${x + 7} V${y - 7}" ${eckig}/></g>`;
    // Zeichen „springt an“ (Version 5): acht kurze gerade Striche (12 lang, Strich mittel, runde Enden), 31,5 bis 43,5 vom Mittelpunkt der Stelle –
    // mindestens 1,5 Strichbreiten frei zum Hirnstamm und zur Hinweislinie. Version 6: ohne die Marke „Belohnungssystem“ (in Version 5 im Kreis der Striche)
    // und ohne Text im Schlüssel – unter dem Bild steht vor der Lösung keine Legende (Lehrkraft 15.11.2026, 22:41).
    const springt = (x, y) => `<g data-teil="innen" data-name="springt an">` +
      [55, 92.86, 130.71, 168.57, 206.43, 244.29, 282.14, 320].map(g => { const a = g * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
        return `<path d="M${(x + 31.5 * c).toFixed(2)} ${(y + 31.5 * s).toFixed(2)} L${(x + 43.5 * c).toFixed(2)} ${(y + 43.5 * s).toFixed(2)}" ${mittel}/>`; }).join('') + `</g>`;
    let t = `<rect width="600" height="380" fill="#fff"/>`;
    t += umriss('Kleinhirn', 'M232 200 C232 172 262 152 292 152 C314 152 326 170 326 192 C326 222 310 248 284 250 C258 252 234 230 232 200 Z');   // reicht unter Großhirn und Hirnstamm
    t += innen('Querlinien', ['M266 192 C280 187 298 186 312 189', 'M262 214 C278 209 296 209 308 212', 'M270 233 C277 229 286 229 293 232']);
    t += umriss('Großhirn', 'M120 210 C72 208 24 176 24 132 C24 115 30 100 40 88 C36 64 66 34 92 40 C104 20 136 12 150 22 C166 6 198 6 212 20 C228 8 256 18 268 38 C288 36 308 56 310 80 C328 90 336 118 330 140 C326 154 316 164 300 168 C276 174 250 180 230 190 C200 208 158 214 120 210 Z');
    t += innen('Furchen', ['M92 40 C100 58 96 76 108 90', 'M150 22 C156 42 146 60 158 76', 'M212 20 C208 40 224 56 216 76', 'M268 38 C256 54 264 72 250 86', 'M310 80 C296 82 288 92 278 92']);
    t += umriss('Rückenmark', 'M232 288 L258 288 L258 384 L232 384 Z');   // reicht unter den Hirnstamm und läuft unten aus dem Bild
    t += umriss('Hirnstamm', 'M198 156 C194 138 232 132 236 150 C240 180 246 212 252 238 C256 258 258 278 258 298 L232 298 C232 284 230 268 224 254 C216 242 186 242 182 220 C179 202 194 190 200 180 C202 172 200 164 198 156 Z');
    if (s === 'teile') {
      t += hin(368, 60, 292, 64, 'flaeche') + wort(374, 69, 'Großhirn');
      t += hin(368, 200, 303, 200, 'flaeche') + wort(374, 209, 'Kleinhirn');
      t += hin(368, 266, 244, 267, 'flaeche') + wort(374, 275, 'Hirnstamm');
      t += hin(368, 330, 245, 330, 'flaeche') + wort(374, 339, 'Rückenmark');
    }
    if (s === 'belohnung') {   // Version 6: keine Marke; das Wort „Belohnungssystem“ nur mit wort = ja (Lösungsbild)
      const an = p.an === true || p.an === 'ja', mitWort = p.wort === true || p.wort === 'ja';
      if (an) t += springt(156, 140);
      t += hin(368, 51, 285, 62, 'flaeche') + wort(374, 60, 'Großhirn');
      if (mitWort) t += hin(368, 86, 156, 140, 'flaeche') + wort(374, 95, 'Belohnungssystem');   // dieselbe Linie wie bei orte, bis zur Stelle
      t += hin(368, 200, 303, 200, 'flaeche') + wort(374, 209, 'Kleinhirn');
      t += hin(368, 266, 244, 267, 'flaeche') + wort(374, 275, 'Hirnstamm');
      t += hin(368, 330, 245, 330, 'flaeche') + wort(374, 339, 'Rückenmark');
    }
    if (s === 'orte') {
      t += marke(156, 140) + marke(244, 268) + marke(245, 344);
      t += hin(368, 86, 173, 135.7, 'kante') + wort(374, 95, 'Belohnungssystem');
      t += hin(368, 258, 261, 266.6, 'kante') + wort(374, 267, 'Atemzentrum') + wort(374, 295, 'im Hirnstamm');
      t += hin(368, 334, 262, 342.6, 'kante') + wort(374, 343, 'Schmerzbahn') + wort(374, 371, 'im Rückenmark');
    }
    const was = { nein: 'ohne Beschriftung der Teile', teile: 'mit Großhirn, Kleinhirn, Hirnstamm und Rückenmark', orte: 'mit drei von mehreren Orten, an denen Opioid-Rezeptoren sitzen',
      belohnung: (p.wort === true || p.wort === 'ja') ? 'mit den Teilen und dem Belohnungssystem tief im Großhirn' + ((p.an === true || p.an === 'ja') ? ' – es springt an' : '')
        : (p.an === true || p.an === 'ja') ? 'mit Großhirn, Kleinhirn, Hirnstamm und Rückenmark – tief im Großhirn springt etwas an' : 'mit Großhirn, Kleinhirn, Hirnstamm und Rückenmark' }[s] || '';
    return `<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gehirn und Rückenmark im Längsschnitt, von der Seite, vereinfacht, ${was}" ` +
      `data-kleinste="26" data-unterschrift="Gehirn und Rückenmark im Längsschnitt" data-vermerk="vereinfacht" data-ebene="Organ">${t}</svg>`;
  },

  // Menge eines Opioids: zwei Orte nebeneinander, je ein Rahmen (Ausschnitt) – Belohnungssystem links, Atemzentrum im Hirnstamm rechts.
  // Je Rahmen zwei Felder, getrennt durch eine Linie von Rand zu Rand (Regel 21): oben die Zelle mit vier Opioid-Rezeptoren und „besetzt: k von 4“,
  // unten die Wirkung – links ein Signalpfeil je besetztem Rezeptor und „Rausch: …“, rechts ein Atemzug-Zeichen je Atemzug und „Atmung: …“.
  // Angabe: stufe = 0 … 4 = besetzte Rezeptoren an beiden Orten (Vereinfachung: beide Orte gleich – danach fragt Station 3, Schritt 3).
  // Atemzüge 4 – 4 – 3 – 2 – 0 (Regel 27: mehr gleich große Zeichen). Keine Messwerte. Belegt: Fachliche Grenze (3) der Quelle.
  menge(p) {
    const k = Math.max(0, Math.min(4, Math.round(+p.stufe || 0)));
    const zuege = [4, 4, 3, 2, 0][k], atem = ['normal', 'normal', 'langsamer', 'sehr langsam', 'setzt aus'][k], rausch = ['keiner', 'schwach', 'mittel', 'stark', 'sehr stark'][k];
    const TS = 'Opioid – Stoff von außen, passt wie ein Nachschlüssel', TR = 'Rezeptor – das Schloss', TP = 'Signal: ein Pfeil je besetztem Rezeptor', TA = 'ein Atemzug in derselben Zeit';
    const yR = 84, yT = 118, w = 288;
    let t = `<rect width="600" height="380" fill="#fff"/>`;
    const feld = (x0, titel, links) => {
      const m = x0 + w / 2, xs = [0, 1, 2, 3].map(i => m - 90 + i * 60);
      let s = `<rect data-teil="rahmen" data-name="${titel}" x="${x0}" y="4" width="${w}" height="372" rx="10" fill="#fff" ${S.duenn}/>`;
      s += S.wort(m, 40, titel, true);
      xs.forEach((x, i) => { s += S.schloss(x, yR, yT, TR); if (i < k) s += S.schluessel(x, yR, true, TS); });   // vor der Zelle: an der Grenze gilt die Kontur der Zelle
      s += `<path data-teil="umriss" data-name="Nachbarzelle" d="M${x0 + 16} ${yT + 10} Q${x0 + 16} ${yT} ${x0 + 26} ${yT} H${x0 + w - 26} Q${x0 + w - 16} ${yT} ${x0 + w - 16} ${yT + 10} V${yT + 26} Q${x0 + w - 16} ${yT + 36} ${x0 + w - 26} ${yT + 36} H${x0 + 26} Q${x0 + 16} ${yT + 36} ${x0 + 16} ${yT + 26} Z" fill="${S.TON}" ${S.dick}/>`;   // gerade Kante von x0 + 26 bis x0 + 262 – alle Schlösser stehen auf der Geraden
      s += S.wort(m, 194, `besetzt: ${k} von 4`, true);
      s += `<line data-teil="trennlinie" x1="${x0}" y1="212" x2="${x0 + w}" y2="212" ${S.duenn}/>`;
      if (links) { for (let i = 0; i < k; i++) s += S.pfeil(xs[i], 228, 64, TP); s += S.wort(m, 332, 'Rausch:', true) + S.wort(m, 362, rausch, true); }
      else {
        const b = 40, g = 18, n = zuege, x1 = m - (n * b + (n - 1) * g) / 2;
        for (let i = 0; i < n; i++) s += S.welle(x1 + i * (b + g), 266, TA);
        s += S.wort(m, 332, 'Atmung:', true) + S.wort(m, 362, atem, true);
      }
      return s;
    };
    t += feld(6, 'Belohnungssystem', true) + feld(306, 'Atemzentrum', false);
    return `<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Menge Stufe ${k}: im Belohnungssystem und im Atemzentrum je ${k} von 4 Opioid-Rezeptoren besetzt; Rausch ${rausch}; Atmung ${atem}, ${zuege} Atemzüge" ` +
      `data-kleinste="26" data-unterschrift="Ein Opioid an zwei Orten: Belohnungssystem und Atemzentrum, je vier Rezeptoren" data-vermerk="vereinfacht" data-ebene="Zelle">${t}</svg>`;
  }
};

</script>

    if (k.art === 'auswahl') { fehlt = z.wahl === null; richtig = z.wahl === k.richtig; }
    if (ZU(k)) {
      fehlt = Object.keys(z.paare).length < k.paare.length;
      if (!fehlt) { let n = 0; k.paare.forEach((p, i) => { if (z.paare[i] === p[1]) { z.fest[i] = true; n++; } else delete z.paare[i]; });
        richtig = n === k.paare.length; if (!richtig) teil = k.art === 'beschriften' ? `${n} von ${k.paare.length} Begriffen sitzen richtig. ` : `${n} von ${k.paare.length} Paaren passen. `; z.male(); }
    }
    if (k.art === 'folge') { const anz = k.bilder.length; fehlt = Object.keys(z.platz).length < anz;
      if (!fehlt) { let t = 0; k.bilder.forEach((b, i) => { if (z.platz[i] === i) { z.fest[i] = true; t++; } else delete z.platz[i]; });
        richtig = t === anz; if (!richtig) teil = `${t} von ${anz} Bildern stehen am richtigen Platz. `; z.male(); } }
    if (fehlt) { meldung(box, 'info', 'Hinweis:', k.art === 'zahl' ? 'Gib eine Zahl ein, zum Beispiel 7,9.' : k.art === 'folge' ? 'Tippe zuerst alle Bilder an.' : AMBILD(k) ? 'Tippe zuerst auf einen Buchstaben im Bild.' : BILDANTWORT(k) ? 'Tippe zuerst auf ein Bild.' : ZU(k) ? (k.art === 'beschriften' ? 'Ordne zuerst jeder Zahl einen Begriff zu.' : 'Ordne zuerst alle Paare zu.') : 'Wähle zuerst eine Antwort.'); zeige(box.querySelector('#rueck')); return; }
    zustand.versuche[s.nr] = (zustand.versuche[s.nr] || 0) + 1; speichern();
    const n = zustand.versuche[s.nr];
    if (richtig) {
      if (k.art === 'auswahl') { const b = box.querySelector(`.opt[data-i="${z.wahl}"]`); b.classList.add('richtig'); b.querySelector('.mark').textContent = '✓ richtig'; }
      box.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
      if (k.art === 'auswahl' && !AMBILD(k) && !BILDANTWORT(k)) box.querySelectorAll('.opt:not(.richtig)').forEach(b => { b.hidden = true; });
      if (k.diagramm) { const bf = box.querySelector('.bildflaeche'); if (bf) bf.innerHTML = diagrammWahl(k, true).svg; }   // Auflösung im Diagramm zeigen
      const hz = box.querySelector('.hilfe'); if (hz) hz.hidden = true;   // Tipps braucht es nicht mehr: Platz für Bestätigung und Code
      meldung(box, 'ok', '✓ Richtig.', md(s.bestaetigung || '')); zeige(box.querySelector('#rueck'));
      const t1 = box.querySelector('#tipp1'), t2 = box.querySelector('#tipp2'); if (t1) t1.disabled = true; if (t2) t2.disabled = true;
      box.querySelector('#loesweg').disabled = true;
      schrittEnde(s, box, erstSchreiben(s)); return;
    }
    let hinweis = '';
    if (k.art === 'auswahl') { const b = box.querySelector(`.opt[data-i="${z.wahl}"]`); hinweis = optHinweis(k.optionen[z.wahl]);
      b.classList.remove('gewaehlt'); b.classList.add('falsch'); b.disabled = true; b.querySelector('.mark').textContent = '✗ falsch'; z.wahl = null; }
    if (n < 2) { meldung(box, 'nein', '✗ Noch nicht.', `${teil}${hinweis ? md(hinweis) + ' ' : ''}Versuch es noch einmal – ein Tipp hilft.`); zeige(box.querySelector('#rueck'), box.querySelector('.hilfe')); return; }
    meldung(box, 'nein', '✗ Noch nicht richtig.', `${teil}${hinweis ? md(hinweis) + ' ' : ''}Sieh dir den Lösungsweg an – oder versuch es noch einmal.`);
    box.querySelector('#loesweg').disabled = false; zeige(box.querySelector('#rueck'), box.querySelector('.hilfe'));
  }

  /* ---------- Bildzeile (V9) ----------
     Eine Zeichnung nennt ihre Unterschrift, ihren Vermerk und ihre Ebene (data-unterschrift, data-vermerk, data-ebene am Bild; mehrere Vermerke mit „|“)
     und den Text zu jedem Zeichen, das kein Abbild ist (data-schluessel am Zeichen). Die Seite setzt daraus die Bildzeile in Seitenschrift unter das Bild:
     Ihre Schrift bleibt gleich groß, wenn das Bild wächst oder schrumpft. Das Zeichen im Schlüssel ist eine Kopie aus der Zeichnung.
     Eine Zeichnung ohne diese Angaben bekommt keine Bildzeile; Bildkarten bekommen nie eine. */
  function zeichenKopie(el) {
    const NS = 'http://www.w3.org/2000/svg', m = document.createElementNS(NS, 'svg'), g = document.createElementNS(NS, 'g'), k = el.cloneNode(true);
    k.removeAttribute('data-schluessel');
    m.setAttribute('width', 10); m.setAttribute('height', 10); m.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
    g.appendChild(k); m.appendChild(g); document.body.appendChild(m);
    let b = null; try { b = g.getBBox(); } catch (e) {}
    m.remove();
    if (!b || !(b.width > 0) || !(b.height > 0)) return '';
    const r = 2, w = b.width + 2 * r, h = b.height + 2 * r, f = Math.min(28 / h, 56 / w);   // 2 Einheiten Rand für den Strich; höchstens 28 px hoch und 56 px breit
    return `<svg viewBox="${b.x - r} ${b.y - r} ${w} ${h}" width="${Math.round(w * f)}" height="${Math.round(h * f)}" aria-hidden="true">${k.outerHTML}</svg>`;
  }
  function bildzeileHtml(svg) {
    const d = svg.dataset, teile = [], gesehen = new Set();
    const marken = liste(d.vermerk).map(v => `<span class="bv">${esc(v)}</span>`).join('') + (d.ebene ? `<span class="bv">Ebene: ${esc(d.ebene)}</span>` : '');
    const kopf = (d.unterschrift ? `<span>${esc(d.unterschrift)}</span>` : '') + (marken ? `<span class="bg">${marken}</span>` : '');   // Vermerk und Ebene bleiben beisammen
    if (kopf) teile.push(`<div class="bu">${kopf}</div>`);
    svg.querySelectorAll('[data-schluessel]').forEach(el => { const t = el.dataset.schluessel.trim(); if (!t || gesehen.has(t)) return; gesehen.add(t);
      teile.push(`<div class="bs">${zeichenKopie(el)}<span>${esc(t)}</span></div>`); });
    return teile.join('');
  }
  function bildzeilen() {
    app.querySelectorAll('.bildbox').forEach(box => {
      const svg = box.querySelector(':scope > svg:not(.linien), :scope > .bildflaeche > svg');
      const von = svg ? [svg.dataset.unterschrift, svg.dataset.vermerk, svg.dataset.ebene].concat([...svg.querySelectorAll('[data-schluessel]')].map(e => e.dataset.schluessel)).map(x => x || '').join('¦') : '';
      let bt = box.nextElementSibling; if (bt && !bt.classList.contains('bildtext')) bt = null;
      if (!von.replace(/¦/g, '')) { if (bt) { bt.remove(); box.parentElement.classList.remove('mit-bildtext'); } return; }
      if (bt && bt.dataset.von === von) return;   // unverändert
      if (!bt) { bt = document.createElement('div'); bt.className = 'bildtext'; box.after(bt); box.parentElement.classList.add('mit-bildtext'); }
      bt.dataset.von = von; bt.innerHTML = bildzeileHtml(svg);
    });
  }

  /* ---------- Anpassen an den Bildschirm ----------
     Ziel: eine Station = ein Bildschirm, hoch wie quer. Reihenfolge: 1. Bild, Modell und Film wachsen oder schrumpfen auf den freien Platz,
     2. reicht das nicht, werden die Abstände enger (--s). Schrift (20 px) und Tippflächen (52 px) ändern sich nie.
     V13 – fester Platz: Die Anordnung wird je Ansicht und Bildschirmgröße einmal gewählt – am Start. Danach bleibt jeder Bereich an seinem Platz,
     und kein Bild wird größer als am Start: Kommt etwas dazu (Rückmeldung, Tipp, Lösungsweg, Hefteintrag, Code), geben Bild und Abstände nach;
     reicht das nicht, rollt die Seite (Entscheidung der Lehrkraft 15.11.2026, 13:25). Neu gewählt wird nur, wenn eine neue Teilansicht beginnt:
     nach „Erst schreiben“ erscheinen die Antworten, der Film wird geladen, der Code erscheint mit der Übersicht der Station, das Gerät
     wird gedreht (gedreht und zurückgedreht steht wieder dieselbe Anordnung). Am Start wählt die Seite wie bisher: die Anordnung mit den
     größten Bildern, die auf einen Bildschirm passt.
     V13 – untere Leiste und Nachrollen: Der freie Platz unter dem Inhalt ist so hoch wie die Leiste (--leiste; sie wird höher, wenn ihre Knöpfe auf
     einem schmalen Bildschirm umbrechen oder das Gerät unten einen Rand hat) – auch am Ende des Rollens liegt nichts hinter ihr. Was neu erscheint,
     rollt ins Bild: so weit, bis sein Ende über der Leiste steht; sein Anfang bleibt unter dem Kopf. */
  const MEDIUM_MIN = 150;   // px Höhe: kleiner wird kein Bild und kein Film
  let leisteEl = null, rollZiel = null;
  const leisteRO = window.ResizeObserver ? new ResizeObserver(() => { if (leisteMessen()) planeAnpassen(); }) : null;
  function leisteMessen() {   // Höhe der unteren Leiste als --leiste; true, wenn sie sich geändert hat
    const f = app.querySelector('footer.fuss'); if (!f) return false;
    if (f !== leisteEl) { leisteEl = f; if (leisteRO) { leisteRO.disconnect(); leisteRO.observe(f); } }
    const h = Math.ceil(f.getBoundingClientRect().height) + 'px', w = document.documentElement.style;
    if (w.getPropertyValue('--leiste') === h) return false;
    w.setProperty('--leiste', h); return true;
  }
  function zeige(von, bis) { if (von) { rollZiel = [von, bis || von]; planeAnpassen(); } }   // nach dem nächsten Anpassen ins Bild rollen: von … bis
  function rolle() {
    if (!rollZiel) return; const [von, bis] = rollZiel; rollZiel = null;
    if (!von.isConnected) return;
    const fuss = app.querySelector('footer.fuss'), kopf = app.querySelector('header.kopf');
    const oben = (kopf ? Math.max(0, kopf.getBoundingClientRect().bottom) : 0) + 8, unten = (fuss ? fuss.getBoundingClientRect().top : window.innerHeight) - 8;
    let a = von.getBoundingClientRect(), b = bis.isConnected ? bis.getBoundingClientRect() : a;
    if (!a.height && !b.height) return; if (!a.height) a = b; if (!b.height) b = a;   // Verborgenes zählt nicht
    const anfang = Math.min(a.top, b.top), ende = Math.max(a.bottom, b.bottom);
    let d = 0;
    if (ende > unten) d = ende - unten;          // nach unten rollen, bis das Ende über der Leiste steht …
    if (anfang - d < oben) d = anfang - oben;    // … der Anfang bleibt unter dem Kopf
    if (Math.abs(d) > 1) window.scrollBy({ top: d, behavior: 'smooth' });
  }
  function neuWaehlen() { const st = app.querySelector('.station'); if (st) { st.dataset.anordnung = ''; st.dataset.s = ''; st._wahl = null; } }   // eine neue Teilansicht beginnt
  function passeAn() {
    leisteMessen();
    const st = app.querySelector('.station'); if (!st) return;
    bildzeilen();
    const fuss = app.querySelector('footer.fuss'), medien = [...st.querySelectorAll('.bildbox, .videobox iframe, .kartenfeld')];
    const haupt = app.querySelector('main'), polster = haupt ? parseFloat(getComputedStyle(haupt).paddingBottom) || 0 : 0;
    const frei = () => window.innerHeight - Math.max(polster, fuss ? fuss.offsetHeight : 0) - 2;   // Unterkante des Inhalts darf die Fußleiste nicht erreichen
    const unten = el => el.getBoundingClientRect().bottom + window.scrollY;
    const passe = () => {   // Größen für die gewählte Anordnung
      const eineSpalte = getComputedStyle(st).gridTemplateColumns.trim().split(/\s+/).length < 2;
      st.style.setProperty('--s', +st.dataset.s || 1); medien.forEach(e => { e.style.maxWidth = e.dataset.start ? e.dataset.start + 'px' : ''; });   // V13: nie größer und nie weiter als zuletzt in dieser Ansicht
      const medienAn = () => { for (let runde = 0; runde < 8; runde++) {
        let bewegt = false;
        for (const e of medien) {
          const spalte = eineSpalte ? st : (e.closest('.f-material, .f-pruef') || st);
          const d = frei() - unten(spalte); if (Math.abs(d) < 3) continue;
          const r = e.getBoundingClientRect(); if (!r.height) continue;
          const platz = Math.min(e.parentElement.getBoundingClientRect().width, +e.dataset.start || 1e5), vorher = unten(spalte);
          const kl = e.querySelector ? e.querySelector('svg[data-kleinste]') : null;   // kleinste Schrift im Bild: mindestens 16 px auf dem Bildschirm
          const minSchrift = kl ? 16 / +kl.dataset.kleinste * (kl.viewBox.baseVal.width || 600) + 6 : 0;   // + Rand der Bildbox
          const minKarten = e.classList.contains('kartenfeld') ? (+getComputedStyle(e).getPropertyValue('--n') || 2) * 150 : 0;
          const breit = Math.min(platz, Math.max(minSchrift, minKarten, Math.max(MEDIUM_MIN, r.height + d) * r.width / r.height));
          if (Math.abs(breit - r.width) < 2) continue;
          e.style.maxWidth = breit + 'px';
          if (d < 0 && Math.abs(unten(spalte) - vorher) < 1) { e.style.maxWidth = r.width + 'px'; continue; }   // Schrumpfen hilft dieser Spalte nicht
          bewegt = true;
        }
        if (!bewegt) break; } };
      medienAn();
      for (const s of [0.85, 0.7, 0.55]) { if (frei() - unten(st) >= -2) break; if (s >= (+st.dataset.s || 1)) continue; st.style.setProperty('--s', s); medienAn(); }
    };
    // V13 – Sperre: Bild und Abstände geben in einer Ansicht nur nach, sie kommen nicht zurück. Ein Bild, das wieder wächst, sobald Tipps oder
    // Rückmeldung weichen, schöbe den Prüfbereich darunter nach unten. Gemerkt wird die kleinste Breite je Bild und die engste Abstandsstufe.
    const merke = () => {
      medien.forEach(e => { const b = e.getBoundingClientRect().width; if (b && !(+e.dataset.start <= b)) e.dataset.start = b; });
      st.dataset.s = st.style.getPropertyValue('--s') || 1;
    };
    // Anordnung: nebeneinander, zwei Spalten oder gestapelt – und wie viele Bildkarten in einer Reihe. Gewählt wird einmal je Ansicht und
    // Bildschirmgröße die Anordnung mit den größten Bildern, die auf einen Bildschirm passt. Danach ändern sich nur noch die Größen.
    const groesse = window.innerWidth + 'x' + window.innerHeight;
    if (st.dataset.anordnung === groesse) { passe(); merke(); return; }   // V13: schon gewählt – die Anordnung bleibt, auch wenn der Inhalt länger wird als der Bildschirm
    const karten = [...st.querySelectorAll('.kartenfeld[data-wahl]')];
    const setze = (a, n, b) => { st.classList.remove('a-stapel', 'a-zwei', 'a-schmal', 'a-mitte', 'a-pruef', 'a-rechts', 'b-stapel'); if (a) st.classList.add(a); if (b) st.classList.add(b); if (n) karten.forEach(k => k.style.setProperty('--n', n)); };
    const merk = st._wahl || (st._wahl = {}), war = merk[groesse];   // V13: je Bildschirmgröße einmal gewählt – nach Drehen und Zurückdrehen steht wieder dieselbe Anordnung
    if (war) { setze(war.a, war.n, war.b); medien.forEach((e, i) => { if (war.start[i]) e.dataset.start = war.start[i]; else delete e.dataset.start; }); st.dataset.s = ''; passe(); merke(); st.dataset.anordnung = groesse; return; }
    medien.forEach(e => { delete e.dataset.start; }); st.dataset.s = '';
    let wahl = { a: '', n: 0, b: '' };
    if (medien.length || frei() - unten(st) < -2) {
      setze('');
      const spalten = getComputedStyle(st).gridTemplateColumns.trim().split(/\s+/).length;
      const modell = st.classList.contains('sim');   // Modell, Film, Regler, Ablauf oder Bilder zum Umschalten stehen in der Materialspalte
      const anordnungen = [''].concat(spalten > 2 || (spalten === 2 && modell) ? ['a-zwei'] : [], spalten === 3 && modell ? ['a-mitte'] : [], spalten === 3 ? ['a-pruef'] : [], spalten === 2 && modell ? ['a-rechts'] : [], spalten === 2 && window.innerWidth >= 1000 ? ['a-schmal'] : [], spalten > 1 ? ['a-stapel'] : []);
      const zahlen = karten.length ? karten[0].dataset.wahl.split(',').map(Number) : [0];
      const innen = st.querySelector('.beschriften') ? ['', 'b-stapel'] : [''];   // Begriffe neben oder unter dem Bild
      let best = null;
      for (const a of anordnungen) for (const n of zahlen) for (const b of innen) {
        setze(a, n, b); passe();
        const lesbar = medien.every(e => { const kl = e.querySelector ? e.querySelector('svg[data-kleinste]') : null; return !kl || +kl.dataset.kleinste * kl.getBoundingClientRect().width / (kl.viewBox.baseVal.width || 600) >= 15.9; });   // Schrift im Bild bleibt lesbar
        const passt = lesbar && frei() - unten(st) >= -2 && document.scrollingElement.scrollWidth <= window.innerWidth + 2;
        const eng = (+st.style.getPropertyValue('--s') || 1) < 1 ? 0.9 : 1;   // enge Abstände nur, wenn das Bild dadurch deutlich größer wird
        const mass = eng * Math.min(...medien.map(e => { const b = e.classList.contains('kartenfeld') ? e.querySelector('.bildkarte') : e; return b ? b.getBoundingClientRect().width : 1e4; }));
        const ueber = Math.max(0, unten(st) - frei());   // passt keine Anordnung, gewinnt die mit dem kleinsten Überstand – nicht die mit dem größten Bild
        if (!best || (passt && !best.passt) || (passt && best.passt && mass > best.mass * 1.08) || (!passt && !best.passt && (lesbar && !best.lesbar || lesbar === best.lesbar && ueber < best.ueber - 4))) best = { a, n, b, passt, mass, ueber, lesbar };   // V13: passt keine, geht lesbare Schrift im Bild vor
      }
      setze(best.a, best.n, best.b); wahl = best;
    }
    passe();
    medien.forEach(e => { const b = e.getBoundingClientRect().width; if (b) e.dataset.start = b; });   // V13: so groß wie jetzt wird kein Bild mehr
    merk[groesse] = { a: wahl.a, n: wahl.n, b: wahl.b, start: medien.map(e => e.dataset.start) };
    st.dataset.s = st.style.getPropertyValue('--s') || 1;
    st.dataset.anordnung = groesse;
  }
  let anpassenGeplant = 0;
  function planeAnpassen() { cancelAnimationFrame(anpassenGeplant); anpassenGeplant = requestAnimationFrame(() => { passeAn(); rolle(); }); }
  new MutationObserver(planeAnpassen).observe(app, { childList: true, subtree: true });
  window.addEventListener('resize', planeAnpassen); window.addEventListener('orientationchange', planeAnpassen);

  const start = L.stationen.find(x => x.nr === zustand.aktuell);
  if (start && istFrei(start)) zeigeStation(start); else zeigeKarte();
})();
</script>
