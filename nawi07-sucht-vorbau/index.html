/* BILDER – eigene SVG-Zeichnungen für Stationen vom Typ „beschriften“ (kontrolle.bild). Keine Buchabbildung. */
function synapseSvg(extra, klein) {   // klein: Bild in der Simulation – kurze, größere Beschriftung

    <rect width="600" height="380" fill="#fff"/>
    <path d="M0 130 H150 C210 130 220 40 300 40 C350 40 360 110 360 190 C360 270 350 340 300 340 C220 340 210 250 150 250 H0 Z" fill="#fbf1a8" stroke="#8a7a2a" stroke-width="3"/>
    <rect x="440" y="0" width="160" height="380" fill="#fbf1a8" stroke="#8a7a2a" stroke-width="3"/>
    <path d="M20 205 H120 M100 187 L124 205 L100 223" fill="none" stroke="#b03a7a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="16" y="${klein ? 170 : 164}" font-size="${klein ? 34 : 22}" fill="#7a2857" font-family="sans-serif">${klein ? "Impuls" : "elektrischer Impuls"}</text>
    <g fill="#fff" stroke="#8a7a2a" stroke-width="3"><circle cx="250" cy="110" r="30"/><circle cx="215" cy="235" r="30"/><circle cx="300" cy="280" r="30"/></g>
    <g fill="#e8833a" stroke="#8a4a14" stroke-width="1.5">
      <rect x="238" y="96" width="11" height="11"/><rect x="254" y="110" width="11" height="11"/><rect x="240" y="116" width="11" height="11"/>
      <rect x="203" y="222" width="11" height="11"/><rect x="219" y="236" width="11" height="11"/><rect x="205" y="242" width="11" height="11"/>
      <rect x="288" y="266" width="11" height="11"/><rect x="304" y="280" width="11" height="11"/><rect x="290" y="288" width="11" height="11"/>
    </g>
    ${extra || `<g fill="#e8833a" stroke="#8a4a14" stroke-width="1.5"><rect x="380" y="92" width="12" height="12"/><rect x="400" y="150" width="12" height="12"/><rect x="376" y="205" width="12" height="12"/><rect x="404" y="262" width="12" height="12"/></g>
    <g fill="#b9a27a" stroke="#6b5732" stroke-width="3"><path d="M424 46 h34 v38 h-34 v-10 h14 v-18 h-14 Z"/><path d="M424 126 h34 v38 h-34 v-10 h14 v-18 h-14 Z"/><path d="M424 206 h34 v38 h-34 v-10 h14 v-18 h-14 Z"/><path d="M424 286 h34 v38 h-34 v-10 h14 v-18 h-14 Z"/></g>`}
  </svg>`;
}
const BILDER = { synapse: synapseSvg(null, true) };

/* SIMULATIONEN – eigene SVG-Zeichnungen. Bedienelemente: class "simctl" (bis zur Vermutung gesperrt). */
const SIMULATIONEN = {
  // Modell mit vier Rezeptoren. Regeln (fest, nachrechenbar):
  // ohne Droge: Impuls setzt 2 Dopamin frei, Warten baut alles ab · Nachschlüssel: 3 Rezeptoren sofort besetzt, bleiben ·
  // Droge A (Abbau gehemmt): Warten baut nichts ab, Dopamin sammelt sich · Droge B (mehr Dopamin): Impuls setzt 4 frei.
  synapse_droge(box) {
    const MODI = ["ohne Droge", "Nachschlüssel", "Droge A", "Droge B"];
    const STAERKE = ["kein Signal", "schwaches Signal", "schwaches Signal", "starkes Signal", "sehr starkes Signal"];
    let m = 0, dop = 0, nach = 0, text = "Stell eine Droge ein oder sende einen Impuls.";
    box.innerHTML = `<div class="simwahl" role="group" aria-label="Einstellung">${MODI.map((n, i) => `<button class="btn sekundaer simctl modus" data-m="${i}" aria-pressed="${i === 0}">${n}</button>`).join('')}</div>
      <div class="bildbox" id="simBild"></div>
      <div class="simwerte"><button class="btn simctl" id="simImpuls">Impuls senden</button><button class="btn sekundaer simctl" id="simWarten">Warten</button></div>
      <p class="simtext" id="simText" role="status" aria-live="polite"></p>`;
    function male() {
      const y = [65, 145, 225, 305]; let teile = '';
      for (let i = 0; i < 4; i++) {
        const droge = i < nach, dopa = !droge && i < nach + dop;
        teile += `<path d="M424 ${y[i] - 19} h34 v38 h-34 v-10 h14 v-18 h-14 Z" fill="#b9a27a" stroke="#6b5732" stroke-width="3"/>`;
        if (droge) teile += `<path d="M424 ${y[i] - 8} h13 v16 h-13 Z" fill="#7b4fb3" stroke="#3e2466" stroke-width="2"/>`;
        if (dopa) teile += `<rect x="425" y="${y[i] - 7}" width="12" height="14" fill="#e8833a" stroke="#8a4a14" stroke-width="1.5"/>`;
        if (droge || dopa) teile += `<path d="M470 ${y[i]} H560 M544 ${y[i] - 14} L564 ${y[i]} L544 ${y[i] + 14}" fill="none" stroke="#b03a7a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      if (m === 1) teile += `<text x="300" y="372" font-size="32" fill="#3e2466" font-family="sans-serif">■ Droge</text>`;
      box.querySelector('#simBild').innerHTML = synapseSvg(teile, true);
      const n = nach + dop;
      box.querySelector('#simText').innerHTML = `<b>Besetzt: ${n} von 4</b> – ${STAERKE[n]}. ${text}`;
      box.querySelectorAll('.modus').forEach((b, i) => { b.setAttribute('aria-pressed', i === m); b.classList.toggle('gewaehlt', i === m); });
    }
    box.querySelectorAll('.modus').forEach(b => b.addEventListener('click', () => {
      m = +b.dataset.m; dop = 0; nach = m === 1 ? 3 : 0;
      text = ["Noch kein Impuls.", "Der Nachschlüssel sitzt in den Rezeptoren – ohne Impuls.", "Droge A hemmt den Abbau von Dopamin. Noch kein Impuls.", "Droge B: Die Bläschen bilden mehr Dopamin. Noch kein Impuls."][m];
      male();
    }));
    box.querySelector('#simImpuls').addEventListener('click', () => {
      dop = Math.min(4 - nach, dop + (m === 3 ? 4 : 2));
      text = m === 3 ? "Die Bläschen waren übervoll: sehr viel Dopamin im Spalt." : "Dopamin ist im Spalt und besetzt Rezeptoren.";
      male();
    });
    box.querySelector('#simWarten').addEventListener('click', () => {
      if (m === 2) text = "Der Abbau ist gehemmt: Das Dopamin bleibt im Spalt.";
      else { text = dop ? "Das Abbauenzym hat das Dopamin abgebaut." : "Nichts abzubauen."; dop = 0; }
      male();
    });
    male();
  }
};

.btn.klein { padding:0; width:52px; font-size:28px; }
.btn[disabled] { background:#fff; color:var(--grau); border-color:var(--linie); border-style:dashed; }
.btn.warnung { background:#fff; color:var(--nein); border-color:var(--nein); }
/* Kopf und Fortschritt */
header.kopf { display:flex; align-items:center; gap:12px; padding:8px 16px; border-bottom:2px solid var(--linie); background:#fff; position:sticky; top:0; z-index:5; }
header.kopf h1 { font-size:28px; line-height:1.25; margin:0; flex:1; font-weight:700; }
.thema, .typ { font-size:16px; color:var(--grau); border:2px solid var(--rand); border-radius:8px; padding:2px 10px; white-space:nowrap; }
.leiste { margin:8px 16px 0; display:flex; align-items:center; gap:12px; }
.fortschritt { flex:1; height:10px; background:var(--linie); border-radius:5px; overflow:hidden; }
.fortschritt > div { height:100%; background:var(--akzent); width:0; transition:width .3s; }
.fortschritt-text { font-size:16px; color:var(--grau); white-space:nowrap; }
main { padding:12px 16px calc(var(--fussh) + 16px); }
/* Landkarte */
.frage-kasten { border-left:8px solid var(--akzent); background:var(--akzentbg); border-radius:10px; padding:10px 16px; margin:0 0 10px; font-weight:600; }
.rahmen { margin:0 0 6px; }
.laufzettel { color:var(--grau); margin:0 0 14px; }
.hinweiszeile { color:var(--grau); margin:8px 0 0; }
h2.abschnitt { font-size:22px; line-height:1.3; margin:18px 0 10px; }
.karte { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
.kachel { position:relative; min-height:112px; border:3px solid var(--rand); border-radius:16px; background:#fff; text-align:left; padding:12px 16px;
  display:flex; flex-direction:column; gap:4px; color:var(--text); }
.kachel .kopfzeile { display:flex; align-items:center; gap:10px; }
.kachel .nr { font-size:30px; font-weight:800; color:var(--akzent); line-height:1; }
.kachel .zustand { margin-left:auto; font-size:16px; font-weight:600; border-radius:8px; padding:1px 8px; }
.kachel .kt { font-weight:600; line-height:1.3; }
.kachel .ks { font-size:16px; color:var(--grau); }
.kachel.erledigt { border-color:var(--ok); background:var(--okbg); }
.kachel.erledigt .zustand { color:var(--ok); }
.kachel.zu { border-style:dashed; background:var(--flaeche); }
.kachel.zu .zustand { color:var(--grau); }
.kachel.naechste { border-color:var(--akzent); box-shadow:0 0 0 3px var(--akzentbg); }
.kachel .sterne, .stufe .sterne { color:var(--orange); font-weight:800; letter-spacing:.05em; }
.weiche-text { margin:0 0 10px; }
.weiche.spalten { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; align-items:start; }
.weiche.spalten .spalte { display:grid; gap:10px; }
.weiche.liste .stufen { display:grid; gap:8px; margin-bottom:12px; }
.weiche.liste .karte { grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); }
.stufe { min-height:52px; width:100%; text-align:left; border:2px solid var(--rand); border-radius:12px; background:#fff; padding:8px 14px; color:var(--text); }
.stufe.gewaehlt { border-color:var(--orange); border-width:3px; background:var(--orangebg); }
.stufe .kaestchen { font-weight:700; margin-right:6px; }
.wahl-zu { color:var(--grau); margin:0 0 10px; }
.unten { margin-top:22px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
/* Station */
.station { display:grid; gap:14px; align-items:start; grid-template-columns:1fr; grid-template-areas:"auftrag" "material" "pruef"; }
.f-auftrag { grid-area:auftrag; } .f-material { grid-area:material; } .f-pruef { grid-area:pruef; }
.f-auftrag, .f-material, .f-pruef { display:grid; gap:14px; align-content:start; min-width:0; }
.f-material:empty { display:none; }
@media (min-width:760px) {
  .station { grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr; grid-template-areas:"auftrag pruef" "material pruef"; }
  .station.sim { grid-template-areas:"auftrag material" "pruef material"; }
  .station.zu-ordnen { grid-template-columns:1fr; grid-template-rows:auto; grid-template-areas:"auftrag" "material" "pruef"; }
}
@media (min-width:1000px) {
  .station.sim { grid-template-columns:1fr 1.1fr 1fr; grid-template-rows:auto; grid-template-areas:"auftrag material pruef"; }
  .station.zu-ordnen { grid-template-columns:.8fr 1.2fr; grid-template-rows:auto 1fr; grid-template-areas:"auftrag pruef" "material pruef"; }
}
.kasten { border:2px solid var(--rand); border-radius:14px; padding:10px 16px 14px; background:#fff; }
.kasten h2 { font-size:var(--grund); line-height:1.4; margin:0 0 4px; color:var(--akzent-dunkel); font-weight:700; }
.auftrag { }
.ziel { margin-top:6px; font-weight:600; }
.ziel .pfeil { color:var(--akzent); }
.heftzeile { margin-top:6px; }
.buch { display:inline-block; margin-top:8px; font-size:16px; color:var(--grau); border:2px solid var(--rand); border-radius:8px; padding:0 10px; }
.merke { background:var(--orangebg); border-left:10px solid var(--orange); border-radius:10px; padding:10px 16px; }
.merke h2 { color:var(--orange); }
.frage { font-weight:600; margin:0 0 10px; }
.optionen { display:grid; gap:10px; }
.opt { min-height:52px; width:100%; text-align:left; padding:8px 16px; border:2px solid var(--rand); border-radius:12px; background:#fff; color:var(--text); line-height:1.35; }
.opt.gewaehlt { border-color:var(--akzent); border-width:3px; background:var(--akzentbg); }
.opt.falsch { border-color:var(--nein); background:var(--neinbg); color:var(--nein); }
.opt.richtig, .opt.fest { border-color:var(--ok); background:var(--okbg); color:var(--ok); }
.opt .mark { float:right; font-weight:700; margin-left:8px; }
.zuordnen { display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr); gap:10px 14px; }
.zuordnen .opt.paar, .beschriften .opt.paar { border-color:var(--akzent); background:var(--akzentbg); }
.beschriften .opt.aktiv { border-color:var(--orange); border-width:3px; }
.bildbox { position:relative; border:2px solid var(--linie); border-radius:12px; overflow:hidden; background:#fff; }
.bildbox svg { display:block; width:100%; height:auto; }
.opt.marke { position:absolute; transform:translate(-50%, -50%); width:54px; min-width:54px; height:54px; min-height:54px; padding:0; border-radius:50%; text-align:center; font-weight:800; font-size:22px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
.opt.marke .mark { position:absolute; left:50%; top:100%; transform:translateX(-50%); float:none; margin:2px 0 0; white-space:nowrap; font-size:16px; font-weight:700; background:#fff; padding:0 6px; border-radius:6px; }
.opt.marke .mark:empty { display:none; }
.opt.marke.oben .mark { top:auto; bottom:100%; margin:0 0 2px; }
.bildbox svg.linien { position:absolute; inset:0; height:100%; pointer-events:none; }
.linien line { stroke:#1d2a3a; stroke-width:2.5; vector-effect:non-scaling-stroke; }
.beschriften .bildbox { width:100%; max-width:540px; margin:0 auto; overflow:visible; }
.begriffe { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
@media (min-width:700px) { .beschriften { display:grid; grid-template-columns:1.35fr 1fr; gap:14px; align-items:start; } .beschriften .begriffe { grid-template-columns:1fr; gap:8px; margin-top:0; } }
a.videolink { display:inline-block; min-height:52px; padding:11px 16px; margin-top:6px; border:2px solid var(--akzent); border-radius:12px; text-decoration:none; background:#fff; }
.simwahl { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.simwahl .btn.gewaehlt { background:var(--akzent); color:#fff; }
.simtext { margin:8px 0 0; }
.videobox { display:grid; gap:10px; }
.videobox iframe { width:100%; aspect-ratio:16 / 9; border:0; border-radius:12px; background:#000; }
.videotitel { margin:0; font-weight:700; }
.videolink { color:var(--akzent-dunkel); font-weight:700; }
.simbox .bildbox { max-width:340px; margin:0 auto; }
.zuordnen .opt.aktiv { border-color:var(--orange); border-width:3px; }
.zahlfeld { display:flex; align-items:center; gap:10px; }
input.zahl { font-size:26px; min-height:56px; width:180px; padding:6px 12px; border:2px solid var(--rand); border-radius:10px; background:#fff; }
input.zahl:focus, .dialog input:focus { outline:3px solid var(--akzent); outline-offset:2px; }
.vergleich { display:flex; gap:12px; align-items:center; border:2px solid var(--pa); border-radius:12px; padding:8px 12px; margin-top:10px; }
.vergleich img { width:44px; height:44px; flex:none; }
.vergleich .titel { font-weight:700; color:var(--pa); }
.rueck { margin-top:10px; }
.rueck .meldung { padding:8px 14px; border-radius:12px; border:2px solid; }
.rueck .ok { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
.rueck .nein { background:var(--neinbg); color:var(--nein); border-color:var(--nein); }
.rueck .info { background:var(--flaeche); color:var(--text); border-color:var(--rand); }
.rueck .sym { font-weight:800; margin-right:4px; }
.hilfe { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; align-items:center; }
.hilfe .btn { padding:8px 12px; }
.hilfe .titel { font-size:18px; color:var(--grau); margin-right:2px; }
.hilfetext { display:grid; gap:8px; margin-top:10px; }
.hilfetext .stufe-box { border:2px solid var(--rand); border-radius:12px; padding:8px 14px; background:var(--flaeche); }
.loesung { border:2px solid var(--akzent); border-radius:12px; padding:10px 14px; margin-top:10px; display:grid; gap:8px; }
.loesung .teil b { color:var(--akzent-dunkel); }
.heftauftrag { border-left:8px solid var(--orange); background:var(--orangebg); border-radius:8px; padding:8px 12px; font-weight:600; }
.codebox { margin-top:12px; border:3px solid var(--ok); background:var(--okbg); border-radius:14px; padding:10px 16px; text-align:center; }
.codebox .code { font-size:34px; font-weight:800; letter-spacing:.06em; color:var(--ok); word-break:break-all; line-height:1.3; }
.codebox .hint { font-size:18px; color:var(--text); }
.checkliste { display:grid; gap:10px; }
.check { min-height:52px; width:100%; text-align:left; padding:8px 14px; border:2px solid var(--rand); border-radius:12px; background:#fff; color:var(--text); line-height:1.35; }
.check .kaestchen { font-weight:700; margin-right:6px; }
.check.an { border-color:var(--ok); background:var(--okbg); }
ol.schritte { padding-left:26px; margin:0; } ol.schritte li { margin:6px 0; }
.vermutung .optionen { margin-top:6px; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
.vermutung .opt { text-align:center; padding:6px 8px; }
.vm-notiz { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.simbox { margin-top:8px; }
.simkopf { display:flex; flex-wrap:nowrap; gap:10px; align-items:center; }
.simlabel { white-space:nowrap; }
.simregler { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
input[type=range] { flex:1; min-width:60px; height:52px; -webkit-appearance:none; appearance:none; background:transparent; }
input[type=range]::-webkit-slider-runnable-track { height:10px; background:var(--rand); border-radius:5px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:44px; height:44px; border-radius:50%; background:var(--akzent); margin-top:-17px; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); }
.simsvg { width:100%; max-height:20vh; display:block; margin:2px auto; }
.simwerte { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.simout { font-size:24px; font-weight:700; }
.modellgrenze { color:var(--grau); margin-top:4px; }
/* Fuß */
footer.fuss { position:fixed; left:0; right:0; bottom:0; min-height:var(--fussh); background:#fff; border-top:2px solid var(--linie);
  display:flex; align-items:center; gap:12px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:5; }
footer .haupt { margin-left:auto; min-width:180px; font-size:22px; }
footer .meta { font-size:16px; color:var(--grau); }
/* Code-Dialog */
.dialog { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:20; padding:16px; }
.dialog .box { background:#fff; border-radius:16px; padding:18px 20px; max-width:520px; width:100%; display:grid; gap:12px; }
.dialog h2 { margin:0; font-size:26px; line-height:1.25; }
.dialog input { font-size:26px; min-height:56px; width:100%; padding:6px 12px; border:2px solid var(--rand); border-radius:10px; letter-spacing:.04em; }
.dialog .knoepfe { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; }
.unsichtbar { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }

  if ((L.jahrgang || 7) <= 6) document.body.classList.add('jg56');
  const TYPNAME = { beschriften: "Beschriften", video: "Video", nachlesen: "Nachlesen + Selbsttest", simulation: "Simulation", buchaufgabe: "Buchaufgabe", stimmt: "Stimmt das?",

  L.stationen.forEach(s => { const k = s.kontrolle; if (k && k.art === 'beschriften') k.paare = k.punkte.map((p, i) => [String(i + 1), p.begriff]); });

  const LEER = () => ({ erledigt: {}, versuche: {}, offen: {}, partner: {}, etappe: {}, aktuell: null });

  let zustand = LEER();
  try { const g = localStorage.getItem(KEY); if (g) zustand = Object.assign(LEER(), JSON.parse(g)); } catch (e) {}
  function speichern() { try { localStorage.setItem(KEY, JSON.stringify(zustand)); } catch (e) {} }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  // **fett** und Formeln wie „G : A = 1“ zusammenhalten (kein Umbruch mitten in der Formel)
  function md(t) {
    return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')

  }
  function istErledigt(s) { return !!zustand.erledigt[s.nr]; }
  function pflichtFertig() { return pflicht.every(istErledigt); }

    if (zustand.offen[s.nr]) return true;
    if (!s.pflicht) return L.weiche ? pflichtFertig() : true;
    if (s.typ === 'abgabe') return pflicht.every(istErledigt);

  function naechstePflicht() { return pflicht.find(s => !istErledigt(s)); }
  function sperrGrund(s) {

  }

  /* ---------- Landkarte ---------- */
  function zeigeKarte() {
    zustand.aktuell = null; speichern();
    const f = fortschritt(), n = naechstePflicht();
    const pf = pflicht.filter(s => s.typ !== 'produkt'), produkt = pflicht.filter(s => s.typ === 'produkt');
    app.innerHTML = `
      <header class="kopf"><h1>${esc(L.titel)}</h1><span class="thema">${esc(L.thema || '')}</span></header>
      <div class="leiste"><div class="fortschritt" aria-hidden="true"><div style="width:${100 * f.n / f.von}%"></div></div>
        <span class="fortschritt-text">${f.n} von ${f.von} Pflichtstationen erledigt</span></div>
      <main>
        ${L.frage ? `<p class="frage-kasten">Darum geht es: ${md(L.frage)}</p>` : ''}
        <p class="rahmen">${RAHMENTEXT[rahmen]}</p>
        <p class="laufzettel">Laufzettel im Heft – je Station eine Zeile: Station · Code · Wie sicher? (☺ sicher · 😐 unsicher · ? nicht gelöst) · Datum${hatEtappen ? '. Darunter ein Feld „Zwischenstand“ (Bleistift).' : ''}</p>
        <h2 class="abschnitt">Pflichtstationen – der Reihe nach</h2>
        <div class="karte">${pf.concat(produkt).map(kachel).join('')}</div>
        ${wahl.length ? wahlBereich() : ''}
        <div class="unten"><button class="btn sekundaer" id="reset">Neu starten</button><span class="meta" id="resetText"></span></div>
      </main>
      <footer class="fuss"><button class="btn sekundaer" id="codeEingabe">Code eingeben</button><span class="meta">${esc(L.version)}</span>
        ${n ? `<button class="btn haupt" id="weiter">Station ${n.nr} ›</button>` : ''}</footer>`;
    app.querySelectorAll('.kachel').forEach(k => k.addEventListener('click', () => {
      const s = L.stationen.find(x => x.nr == k.dataset.nr);
      if (!istFrei(s)) { dialogCode(s, sperrGrund(s)); return; }
      zeigeStation(s);
    }));
    app.querySelectorAll('.stufe').forEach(b => b.addEventListener('click', () => {
      app.querySelectorAll('.stufe').forEach(x => { x.classList.remove('gewaehlt'); x.setAttribute('aria-pressed', 'false'); x.querySelector('.kaestchen').textContent = '☐'; });

    });

  function zustandText(s) { return istErledigt(s) ? '✓ erledigt' : !istFrei(s) ? 'noch zu' : 'offen'; }
  function kachel(s) {

  function wahlBereich() {
    const offen = !L.weiche || pflichtFertig();

    if (!offen) return `${titel}<p class="wahl-zu">Sie öffnen, wenn du alle Pflichtstationen erledigt hast. Antworten ins Heft, weiter im Lernbüro.</p><div class="karte">${wahl.map(kachel).join('')}</div>`;

        richtig = n === k.paare.length; if (!richtig) teil = k.art === 'beschriften' ? `${n} von ${k.paare.length} Begriffen sitzen richtig. ` : `${n} von ${k.paare.length} Paaren passen. `; z.male(); }
    }
    if (fehlt) { meldung(box, 'info', 'Hinweis:', k.art === 'zahl' ? 'Gib eine Zahl ein, zum Beispiel 7,9.' : ZU(k) ? (k.art === 'beschriften' ? 'Ordne zuerst jeder Zahl einen Begriff zu.' : 'Ordne zuerst alle Paare zu.') : 'Wähle zuerst eine Antwort.'); return; }
    zustand.versuche[s.nr] = (zustand.versuche[s.nr] || 0) + 1; speichern();
    const n = zustand.versuche[s.nr];
    if (richtig) {
      if (k.art === 'auswahl') { const b = box.querySelector(`.opt[data-i="${z.wahl}"]`); b.classList.add('richtig'); b.querySelector('.mark').textContent = '✓ richtig'; }
      box.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
      meldung(box, 'ok', '✓ Richtig.', md(s.bestaetigung || ''));
      const t1 = box.querySelector('#tipp1'), t2 = box.querySelector('#tipp2'); if (t1) t1.disabled = true; if (t2) t2.disabled = true;
      box.querySelector('#loesweg').disabled = true;
      zumCode(s, box); return;
    }
    let hinweis = '';
    if (k.art === 'auswahl') { const b = box.querySelector(`.opt[data-i="${z.wahl}"]`); hinweis = optHinweis(k.optionen[z.wahl]);
      b.classList.remove('gewaehlt'); b.classList.add('falsch'); b.disabled = true; b.querySelector('.mark').textContent = '✗ falsch'; z.wahl = null; }
    if (n < 2) { meldung(box, 'nein', '✗ Noch nicht.', `${teil}${hinweis ? md(hinweis) + ' ' : ''}Versuch es noch einmal – ein Tipp hilft.`); return; }
    meldung(box, 'nein', '✗ Noch nicht richtig.', `${teil}${hinweis ? md(hinweis) + ' ' : ''}Sieh dir den Lösungsweg an – oder versuch es noch einmal.`);
    box.querySelector('#loesweg').disabled = false;
  }

  const start = L.stationen.find(x => x.nr === zustand.aktuell);
  if (start && istFrei(start)) zeigeStation(start); else zeigeKarte();
})();
