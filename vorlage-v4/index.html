<script>
/* ============================================================

   Regeln: 00_Regeln/Spezifikationen/Spez_Lernlandschaft.md (Vorlage V4, Testfassung 11.11.2026)
   Alles unterhalb von "ENDE DATENBLOCK" bleibt unverändert.

   Felder je Station (* = Pflichtfeld):
   nr*, typ* ("nachlesen" | "simulation" | "buchaufgabe" | "stimmt" | "selbstkontrolle" | "konstruktion" | "produkt" | "abgabe"),

   kontrolle { art: "auswahl" (optionen: Text oder { text, hinweis }, richtig) | "zahl" (wert, toleranz, einheit) | "zuordnen" (paare) },

   ============================================================ */
const LANDSCHAFT = {
  titel: "Rechtwinklige Dreiecke – Üben",

  frage: "Wie findest du im rechtwinkligen Dreieck eine fehlende Seite?",   // erscheint oben auf der Landkarte

    { nr: 1, typ: "nachlesen", pflicht: true, minuten: 10, titel: "Seiten im rechtwinkligen Dreieck",

                   "Die Hypotenuse liegt dem rechten Winkel gegenüber.",
                   { text: "Die Ankathete ist immer die kürzeste Seite.", hinweis: "Welche Kathete die Ankathete ist, hängt vom Winkel ab, nicht von der Länge." }], richtig: 1 },

                   { text: "bei 60°", hinweis: "Bei 60° ist die Gegenkathete schon länger als die Ankathete." },
                   { text: "bei keinem Winkel", hinweis: "Doch: Bei einem Winkel sind beide Katheten gleich lang." }], richtig: 1 },
      bestaetigung: "Bei 45° ist G : A = 1, weil dann beide Katheten gleich lang sind.",
      tipps: ["Wann sind Gegenkathete und Ankathete gleich lang?", "Stell α auf 45° und lies G : A ab."],
      loesungsweg: "Bei 45° sind beide Katheten gleich lang, also G : A = 1. Bei größeren Winkeln wird die Gegenkathete länger als die Ankathete.",

      vergleich: "Vergleicht eure Je-desto-Sätze: Steht ein „weil“ darin?",

      ziel: "Du kannst eine fehlende Seite mit tan berechnen.",
      heft: "Rechnung mit Formel und Einheit.",

      kontrolle: { art: "zahl", frage: "a) Gesuchte Seite in cm, eine Stelle nach dem Komma:", wert: 7.9, toleranz: 0.15, einheit: "cm" },
      bestaetigung: "Das passt, weil a = 4,2 cm · tan 62° ≈ 7,9 cm ist.",
      tipps: ["Welche Seiten kennst du, welche suchst du? Gegenkathete und Ankathete – das passt zu tan.", "Stell die Formel um: a = b · tan α."],

    { nr: 4, typ: "selbstkontrolle", pflicht: true, minuten: 10, titel: "sin, cos oder tan?",
      auftrag: "**Tippe** links auf ein Verhältnis, dann rechts auf seinen Namen.",

      kontrolle: { art: "zuordnen", paare: [["Gegenkathete : Hypotenuse", "sin α"], ["Ankathete : Hypotenuse", "cos α"], ["Gegenkathete : Ankathete", "tan α"]] },
      bestaetigung: "Die Paare passen, weil sin und cos die Hypotenuse brauchen, tan aber nur die beiden Katheten.",
      tipps: ["Nur ein Verhältnis kommt ohne Hypotenuse aus.", "sin: Gegenkathete durch Hypotenuse. cos: Ankathete durch Hypotenuse."],

    { nr: 7, typ: "konstruktion", pflicht: false, stufe: 2, minuten: 15, titel: "Konstruieren und prüfen",
      wofuer: "Anwenden: Rechnung und Zeichnung vergleichen.",
      ziel: "Du prüfst eine Rechnung mit einer Zeichnung.",

      heft: "Konstruktion und Vergleich.",
      buch: "S. 129 Nr. 4",

/* SIMULATIONEN – eigene SVG-Zeichnungen. Je Landschaft nach Bedarf ergänzen.
   Eine Simulation ist eine Funktion (box) → sie zeichnet in den Container. Bedienelemente: class "simctl" (bis zur Vermutung gesperrt). */
const SIMULATIONEN = {
  steigungsdreieck: function (box) {
    box.innerHTML = `
      <div class="simkopf"><span class="simlabel">α = <output id="simA">35°</output></span>
        <div class="simregler"><button class="btn klein simctl" data-d="-1" aria-label="Winkel kleiner">−</button>
        <input type="range" class="simctl" id="simR" min="5" max="85" step="1" value="35" aria-label="Winkel α">
        <button class="btn klein simctl" data-d="1" aria-label="Winkel größer">+</button></div></div>
      <svg viewBox="0 24 420 280" class="simsvg" role="img" aria-label="Rechtwinkliges Dreieck mit dem Winkel α">
        <polygon id="tri" points="40,260 360,260 360,100" fill="#f3f6fa" stroke="#1d2a3a" stroke-width="4" stroke-linejoin="round"/>
        <path id="rw" d="M340,260 L340,240 L360,240" fill="none" stroke="#1d2a3a" stroke-width="3"/>
        <path id="arc" d="" fill="none" stroke="#b23a2a" stroke-width="3"/>
        <text x="64" y="244" font-size="31" fill="#b23a2a">α</text>
        <text x="120" y="296" font-size="31" fill="#1d2a3a">Ankathete A</text>
        <text id="tG" x="368" y="190" font-size="31" fill="#1d2a3a">G</text>
      </svg>
      <div class="simwerte"><button class="btn sekundaer simctl" id="simZeig">G : A anzeigen</button>
        <output id="simV" class="simout" hidden></output></div>`;
    const r = box.querySelector('#simR'), out = box.querySelector('#simA'), tri = box.querySelector('#tri'),
          arc = box.querySelector('#arc'), tG = box.querySelector('#tG'), v = box.querySelector('#simV');
    function zeichne() {
      const a = +r.value, A = 320, G = Math.tan(a * Math.PI / 180) * A, Gmax = 230;
      const s = G > Gmax ? Gmax / G : 1, Ax = 40 + A * s, Gy = 260 - G * s;
      tri.setAttribute('points', `40,260 ${Ax},260 ${Ax},${Gy}`);
      box.querySelector('#rw').setAttribute('d', `M${Ax - 20},260 L${Ax - 20},240 L${Ax},240`);
      const rad = a * Math.PI / 180, R = 50;
      arc.setAttribute('d', `M${40 + R},260 A${R},${R} 0 0 0 ${40 + R * Math.cos(rad)},${260 - R * Math.sin(rad)}`);
      tG.setAttribute('x', Math.min(Ax + 8, 396)); tG.setAttribute('y', (260 + Gy) / 2);
      out.textContent = a + '°';
      v.textContent = 'G : A = ' + (G / A).toFixed(2).replace('.', ',');
    }
    r.addEventListener('input', zeichne);
    box.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { r.value = +r.value + +b.dataset.d; zeichne(); }));
    box.querySelector('#simZeig').addEventListener('click', () => { v.hidden = false; });
    zeichne();
  }
};
/* ============================ ENDE DATENBLOCK ============================ */

<style>
:root { --akzent:#1f6f8b; --akzent-dunkel:#175466; --akzentbg:#e8f1f5; --text:#1d2a3a; --grau:#5f6b7a; --rand:#7a8591; --linie:#c9d1da;

.zuordnen { display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(0, 1fr); gap:10px 14px; }
.zuordnen .opt.paar { border-color:var(--akzent); background:var(--akzentbg); }
.zuordnen .opt.aktiv { border-color:var(--orange); border-width:3px; }
.zahlfeld { display:flex; align-items:center; gap:10px; }
input.zahl { font-size:26px; min-height:56px; width:180px; padding:6px 12px; border:2px solid var(--rand); border-radius:10px; background:#fff; }
input.zahl:focus, .dialog input:focus { outline:3px solid var(--akzent); outline-offset:2px; }
.vergleich { display:flex; gap:12px; align-items:center; border:2px solid var(--pa); border-radius:12px; padding:8px 12px; margin-top:10px; }
.vergleich img { width:44px; height:44px; flex:none; }
.vergleich .titel { font-weight:700; color:var(--pa); }
.rueck { margin-top:10px; }
.rueck .meldung { padding:8px 14px; border-radius:12px; border:2px solid; }
.rueck .ok { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
.rueck .nein { background:var(--neinbg); color:var(--nein); border-color:var(--nein); }
.rueck .info { background:var(--flaeche); color:var(--text); border-color:var(--rand); }
.rueck .sym { font-weight:800; margin-right:4px; }
.hilfe { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; align-items:center; }
.hilfe .btn { padding:8px 12px; }
.hilfe .titel { font-size:18px; color:var(--grau); margin-right:2px; }
.hilfetext { display:grid; gap:8px; margin-top:10px; }
.hilfetext .stufe-box { border:2px solid var(--rand); border-radius:12px; padding:8px 14px; background:var(--flaeche); }
.loesung { border:2px solid var(--akzent); border-radius:12px; padding:10px 14px; margin-top:10px; display:grid; gap:8px; }
.loesung .teil b { color:var(--akzent-dunkel); }
.heftauftrag { border-left:8px solid var(--orange); background:var(--orangebg); border-radius:8px; padding:8px 12px; font-weight:600; }
.codebox { margin-top:12px; border:3px solid var(--ok); background:var(--okbg); border-radius:14px; padding:10px 16px; text-align:center; }
.codebox .code { font-size:34px; font-weight:800; letter-spacing:.06em; color:var(--ok); word-break:break-all; line-height:1.3; }
.codebox .hint { font-size:18px; color:var(--text); }
.checkliste { display:grid; gap:10px; }
.check { min-height:52px; width:100%; text-align:left; padding:8px 14px; border:2px solid var(--rand); border-radius:12px; background:#fff; color:var(--text); line-height:1.35; }
.check .kaestchen { font-weight:700; margin-right:6px; }
.check.an { border-color:var(--ok); background:var(--okbg); }
ol.schritte { padding-left:26px; margin:0; } ol.schritte li { margin:6px 0; }
.vermutung .optionen { margin-top:6px; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
.vermutung .opt { text-align:center; padding:6px 8px; }
.vm-notiz { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.simbox { margin-top:8px; }
.simkopf { display:flex; flex-wrap:nowrap; gap:10px; align-items:center; }
.simlabel { white-space:nowrap; }
.simregler { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
input[type=range] { flex:1; min-width:60px; height:52px; -webkit-appearance:none; appearance:none; background:transparent; }
input[type=range]::-webkit-slider-runnable-track { height:10px; background:var(--rand); border-radius:5px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:44px; height:44px; border-radius:50%; background:var(--akzent); margin-top:-17px; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); }
.simsvg { width:100%; max-height:20vh; display:block; margin:2px auto; }
.simwerte { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.simout { font-size:24px; font-weight:700; }
.modellgrenze { color:var(--grau); margin-top:4px; }
/* Fuß */
footer.fuss { position:fixed; left:0; right:0; bottom:0; min-height:var(--fussh); background:#fff; border-top:2px solid var(--linie);
  display:flex; align-items:center; gap:12px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); z-index:5; }
footer .haupt { margin-left:auto; min-width:180px; font-size:22px; }
footer .meta { font-size:16px; color:var(--grau); }
/* Code-Dialog */
.dialog { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:20; padding:16px; }
.dialog .box { background:#fff; border-radius:16px; padding:18px 20px; max-width:520px; width:100%; display:grid; gap:12px; }
.dialog h2 { margin:0; font-size:26px; line-height:1.25; }
.dialog input { font-size:26px; min-height:56px; width:100%; padding:6px 12px; border:2px solid var(--rand); border-radius:10px; letter-spacing:.04em; }
.dialog .knoepfe { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; }
.unsichtbar { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
</style>
</head>

  function wahlBereich() {
    const offen = !L.weiche || pflichtFertig();

  // Pflicht nacheinander: Der Code einer Pflichtstation gilt auch für alle Pflichtstationen davor (Spez D8).
  // Ausnahme: Stationen mit Öffnungscode (oeffnetMit) – sie sind auch ohne Vorgänger erreichbar.
  function davorErledigt(s) {
    if (!s.pflicht || s.oeffnetMit || L.freischaltung !== 'nacheinander') return;
    pflicht.slice(0, pflicht.indexOf(s)).forEach(p => { zustand.erledigt[p.nr] = true; });
  }
  function dialogZwischen(s) {
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'dlgTitel');
    d.innerHTML = `<div class="box"><h2 id="dlgTitel">Zwischenstand</h2><p>Was steht schon in deinem Heft? Tippe es an.</p>
      <div class="checkliste">${s.etappen.map((e, i) => `<button class="check" data-i="${i}" aria-pressed="false"><span class="kaestchen">☐</span>${md(e.nach)}</button>`).join('')}</div>
      <div id="zwCode" role="status" aria-live="polite"><p>Noch nicht so weit? Dann gilt der Code deiner letzten Station.</p></div>
      <div class="knoepfe"><button class="btn" id="dlgZu">Schließen</button></div></div>`;
    document.body.appendChild(d);
    d.querySelector('#dlgZu').addEventListener('click', () => d.remove());
    const ch = d.querySelectorAll('.check');
    ch.forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      ch.forEach((x, k) => { const an = k <= i; x.classList.toggle('an', an); x.setAttribute('aria-pressed', an); x.querySelector('.kaestchen').textContent = an ? '☑' : '☐'; });
      zustand.etappe[s.nr] = i + 1; speichern();
      d.querySelector('#zwCode').innerHTML = `<div class="codebox"><div>Dein Zwischenstand für Station ${s.nr}:</div><div class="code">${esc(s.etappen[i].code)}</div>
        <div class="hint">Trag ihn mit Bleistift in das Feld „Zwischenstand“ auf deinem Laufzettel ein. Damit startest du wieder in Station ${s.nr}.</div></div>`;
    }));
  }
  function dialogCode(station, text) {
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'dlgTitel');
    d.innerHTML = `<div class="box"><h2 id="dlgTitel">Code eingeben</h2><p>${esc(text)}</p>
      <input type="text" id="dlgCode" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Code">
      <p id="dlgMsg" role="status" aria-live="polite"></p>
      <div class="knoepfe"><button class="btn sekundaer" id="dlgAbbr">Abbrechen</button><button class="btn" id="dlgOk">Code prüfen</button></div></div>`;
    document.body.appendChild(d);
    const inp = d.querySelector('#dlgCode'); setTimeout(() => inp.focus(), 50);
    d.querySelector('#dlgAbbr').addEventListener('click', () => d.remove());
    const pruefe = () => {
      const c = inp.value.trim().toUpperCase().replace(/\s+/g, '');
      if (!c) { d.querySelector('#dlgMsg').textContent = 'Gib zuerst einen Code ein.'; return; }
      const auf = L.stationen.find(x => x.oeffnetMit && x.oeffnetMit.toUpperCase() === c);
      if (auf) { zustand.offen[auf.nr] = true; speichern(); d.remove(); zeigeStation(auf); return; }
      // Zwischenstand: Codewort einer Etappe öffnet die Station an dieser Stelle
      for (const x of L.stationen) {
        const i = (x.etappen || []).findIndex(e => e.code && e.code.toUpperCase() === c);
        if (i < 0) continue;
        davorErledigt(x);
        if (!istFrei(x)) zustand.offen[x.nr] = true;
        if (!istErledigt(x)) zustand.etappe[x.nr] = Math.max(zustand.etappe[x.nr] || 0, i + 1);
        speichern(); d.remove(); zeigeStation(x); return;
      }
      const s = L.stationen.find(x => x.code && x.code.toUpperCase() === c);
      if (!s) { d.querySelector('#dlgMsg').textContent = 'Diesen Code gibt es nicht. Schau noch einmal in deinen Laufzettel.'; return; }
      davorErledigt(s);
      zustand.erledigt[s.nr] = true; speichern(); d.remove(); zeigeKarte();
    };
    d.querySelector('#dlgOk').addEventListener('click', pruefe);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') pruefe(); });
  }

  /* ---------- Station ---------- */

      <header class="kopf"><button class="btn sekundaer" id="zurueck">‹ Karte</button><h1>${s.nr}. ${md(s.titel)}</h1><span class="typ">${s.stufe ? STUFE[s.stufe].sterne + ' ' + STUFE[s.stufe].name : TYPNAME[s.typ]}</span></header>

    fa.innerHTML = `${etappe ? `<div class="rueck"><p class="meldung info"><span class="sym">Zwischenstand:</span> ${md(etappe.nach)} Mach an dieser Stelle weiter.</p></div>` : ''}<section class="kasten"><h2>Auftrag</h2><p class="auftrag">${md(s.auftrag)}</p>

    fm.innerHTML = mat;
    if (s.sim && SIMULATIONEN[s.sim]) { SIMULATIONEN[s.sim](fm.querySelector('#simbox')); if (s.vermutung && !zustand.erledigt[s.nr] && !etappe) simSperren(fm, true); bindeVermutung(s, fm); }

  function vermutungHtml(s) {

  function checklisteStation(s, box) {

  function pruefStation(s, box) {

  function eingabe(k) {
    if (k.art === 'zahl') return `<p class="frage">${md(k.frage)}</p><div class="zahlfeld"><input type="text" inputmode="decimal" class="zahl" id="eZahl" autocomplete="off" aria-label="Deine Zahl">

  function optText(o) { return typeof o === 'string' ? o : o.text; }
  function optHinweis(o) { return typeof o === 'string' ? '' : (o.hinweis || ''); }
  function mische(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function bindeEingabe(s, box, z) {
    const k = s.kontrolle;
    if (k.art === 'auswahl') box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (b.classList.contains('falsch')) return;

      b.classList.add('gewaehlt'); b.setAttribute('aria-pressed', 'true'); z.wahl = +b.dataset.i; }));
    if (k.art === 'zuordnen') {
      const L_ = box.querySelectorAll('.opt.links'), R_ = box.querySelectorAll('.opt.rechts');
      z.male = function () {
        L_.forEach(b => { const i = b.dataset.i; b.classList.toggle('paar', i in z.paare && !z.fest[i]); b.classList.toggle('aktiv', z.aktiv === i);
          b.classList.toggle('fest', !!z.fest[i]); b.disabled = !!z.fest[i];
          b.querySelector('.mark').textContent = z.fest[i] ? '✓ passt' : i in z.paare ? 'Paar ' + (+i + 1) : ''; });
        R_.forEach(b => { const e = Object.entries(z.paare).find(([, t]) => t === b.dataset.t); const fest = e && z.fest[e[0]];
          b.classList.toggle('paar', !!e && !fest); b.classList.toggle('fest', !!fest); b.disabled = !!fest;
          b.querySelector('.mark').textContent = fest ? '✓ passt' : e ? 'Paar ' + (+e[0] + 1) : ''; });
      };
      L_.forEach(b => b.addEventListener('click', () => { const i = b.dataset.i; if (z.fest[i]) return; if (i in z.paare) { delete z.paare[i]; z.aktiv = null; } else z.aktiv = z.aktiv === i ? null : i; z.male(); }));
      R_.forEach(b => b.addEventListener('click', () => { const t = b.dataset.t; const e = Object.entries(z.paare).find(([, x]) => x === t);
        if (e) { if (z.fest[e[0]]) return; delete z.paare[e[0]]; z.aktiv = null; } else if (z.aktiv !== null) { z.paare[z.aktiv] = t; z.aktiv = null; } z.male(); }));
    }
  }
  function meldung(box, art, sym, text) {
    box.querySelector('#rueck').innerHTML = `<p class="meldung ${art}"><span class="sym">${sym}</span> ${text}</p>`;
  }
  function pruefe(s, box, z) {
    const k = s.kontrolle; let richtig = false, fehlt = false, teil = '';
    if (k.art === 'zahl') {
      const roh = (box.querySelector('#eZahl').value || '').replace(/[^0-9,.\-]/g, '').replace(',', '.');
      const v = parseFloat(roh); fehlt = roh === '' || isNaN(v); richtig = !fehlt && Math.abs(v - k.wert) <= (k.toleranz || 0);
    }
    if (k.art === 'auswahl') { fehlt = z.wahl === null; richtig = z.wahl === k.richtig; }
    if (k.art === 'zuordnen') {
      fehlt = Object.keys(z.paare).length < k.paare.length;
      if (!fehlt) { let n = 0; k.paare.forEach((p, i) => { if (z.paare[i] === p[1]) { z.fest[i] = true; n++; } else delete z.paare[i]; });
        richtig = n === k.paare.length; if (!richtig) teil = `${n} von ${k.paare.length} Paaren passen. `; z.male(); }
    }
    if (fehlt) { meldung(box, 'info', 'Hinweis:', k.art === 'zahl' ? 'Gib eine Zahl ein, zum Beispiel 7,9.' : k.art === 'zuordnen' ? 'Ordne zuerst alle Paare zu.' : 'Wähle zuerst eine Antwort.'); return; }
    zustand.versuche[s.nr] = (zustand.versuche[s.nr] || 0) + 1; speichern();
    const n = zustand.versuche[s.nr];
    if (richtig) {
      if (k.art === 'auswahl') { const b = box.querySelector(`.opt[data-i="${z.wahl}"]`); b.classList.add('richtig'); b.querySelector('.mark').textContent = '✓ richtig'; }
      box.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
      meldung(box, 'ok', '✓ Richtig.', md(s.bestaetigung || ''));
      const t1 = box.querySelector('#tipp1'), t2 = box.querySelector('#tipp2'); if (t1) t1.disabled = true; if (t2) t2.disabled = true;
      box.querySelector('#loesweg').disabled = true;
      zumCode(s, box); return;
    }
    let hinweis = '';
    if (k.art === 'auswahl') { const b = box.querySelector(`.opt[data-i="${z.wahl}"]`); hinweis = optHinweis(k.optionen[z.wahl]);
      b.classList.remove('gewaehlt'); b.classList.add('falsch'); b.disabled = true; b.querySelector('.mark').textContent = '✗ falsch'; z.wahl = null; }
    if (n < 2) { meldung(box, 'nein', '✗ Noch nicht.', `${teil}${hinweis ? md(hinweis) + ' ' : ''}Versuch es noch einmal – ein Tipp hilft.`); return; }
    meldung(box, 'nein', '✗ Noch nicht richtig.', `${teil}${hinweis ? md(hinweis) + ' ' : ''}Sieh dir den Lösungsweg an – oder versuch es noch einmal.`);
    box.querySelector('#loesweg').disabled = false;
  }

  const start = L.stationen.find(x => x.nr === zustand.aktuell);
  if (start && istFrei(start)) zeigeStation(start); else zeigeKarte();
})();
