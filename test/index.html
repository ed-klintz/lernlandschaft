<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe Lernlandschaft · Fassung 3</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<style>
  :root { --blau:#1f4e79; --blauhell:#e6eef6; --gruen:#1e7b3c; --gruenhell:#e5f3e9; --rot:#b3261e;
          --gelb:#fff4d6; --grau:#5f6368; --linie:#d5dae0; --hell:#f3f6f9; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:19px; line-height:1.45;
         color:#1a1a1a; background:var(--hell); }
  header { background:var(--blau); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px;
           position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:21px; flex:1; }
  header .probe { font-size:13px; opacity:.8; font-weight:400; display:block; }
  main { max-width:780px; margin:0 auto; padding:18px; }
  h2 { font-size:17px; text-transform:uppercase; letter-spacing:.06em; color:var(--grau); margin:26px 4px 10px; }
  .karte { background:#fff; border-radius:16px; padding:18px 20px; margin-bottom:14px; border:2px solid transparent; }
  button { font:inherit; font-weight:600; min-height:54px; padding:12px 22px; border:0; border-radius:14px;
           background:var(--blau); color:#fff; cursor:pointer; touch-action:manipulation; }
  button:active { transform:scale(.97); }
  button.zweit { background:var(--blauhell); color:var(--blau); }
  button.hell { background:rgba(255,255,255,.18); color:#fff; min-height:46px; padding:8px 16px; font-size:17px; }
  button.text { background:none; color:var(--grau); font-weight:400; text-decoration:underline; min-height:44px; padding:8px; }
  button:disabled { opacity:.45; }
  .reihe { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .zwei { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px) { .zwei { grid-template-columns:1fr; } }

  /* Stationskarten */
  .station { display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:#fff; color:#1a1a1a;
             border:2px solid var(--linie); border-radius:16px; padding:16px 18px; margin-bottom:12px; min-height:84px; }
  .station .nr { flex:none; width:50px; height:50px; border-radius:50%; background:var(--blau); color:#fff;
                 display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  .station .titel { font-weight:700; display:block; }
  .station .lage { font-weight:400; color:var(--grau); font-size:16px; display:block; }
  .station .will { font-weight:600; color:var(--blau); font-size:15px; display:block; }
  .station.erledigt { background:var(--gruenhell); border-color:var(--gruen); }
  .station.erledigt .nr { background:var(--gruen); }
  .station.laeuft { border-color:var(--blau); background:var(--blauhell); }
  .station.gesperrt { opacity:.5; }
  .station.gesperrt .nr { background:var(--grau); }

  /* Code */
  .code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:54px; font-weight:700; letter-spacing:.16em;
          color:var(--blau); background:var(--gelb); border:3px dashed #d9b64a; border-radius:16px;
          padding:14px 10px 14px 22px; text-align:center; margin:14px 0; user-select:all; }
  .eingabe { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:30px; font-weight:700; letter-spacing:.14em;
             text-transform:uppercase; width:210px; padding:9px 12px; border:2px solid var(--linie); border-radius:14px;
             text-align:center; }
  .eingabe:focus { outline:3px solid #9fc0e0; border-color:var(--blau); }
  .meldung { margin:10px 0 0; font-weight:600; }
  .meldung.fehler { color:var(--rot); }
  .meldung.gut { color:var(--gruen); }
  .klein { color:var(--grau); font-size:16px; }

  /* Station */
  .schritte { display:flex; gap:8px; margin:0 0 16px; }
  .schritte span { flex:1; height:10px; border-radius:5px; background:var(--linie); }
  .schritte span.voll { background:var(--gruen); }
  .schritte span.jetzt { background:var(--blau); }
  .auftrag { font-size:21px; margin:8px 0 18px; }
  .hinweis { background:var(--gruenhell); border-radius:12px; padding:10px 14px; margin:0 0 14px; font-weight:600; color:var(--gruen); }
  .gross { font-size:28px; font-weight:700; margin:0 0 4px; }

  /* Dialog */
  .schleier { position:fixed; inset:0; background:rgba(15,25,40,.55); display:flex; align-items:center; justify-content:center;
              padding:18px; z-index:20; }
  .dialog { background:#fff; border-radius:20px; padding:24px; max-width:520px; width:100%; max-height:90vh; overflow:auto; }
  .dialog h3 { margin:0 0 8px; font-size:23px; }
  .dialog .reihe { margin-top:18px; justify-content:flex-end; }

  table { border-collapse:collapse; width:100%; font-size:17px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--linie); }
  td.c { font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; font-size:20px; letter-spacing:.1em; }
  label.wahl { display:flex; align-items:center; gap:12px; min-height:48px; }
  input[type=checkbox] { width:26px; height:26px; }
  select { font:inherit; padding:10px; border-radius:10px; border:2px solid var(--linie); min-height:48px; }
  footer { text-align:center; padding:6px 18px 30px; }
</style>
</head>
<body>
<header id="kopf"></header>
<main id="inhalt"></main>
<footer id="fuss"></footer>
<div id="dialogort"></div>

<script>
/* ============================================================
   1 · Inhalt der Lernlandschaft (hier: Beispielinhalte der Probe)
   ============================================================ */
var LL = {
  id: 'probe-2',
  titel: 'Probe Lernlandschaft',
  stationen: [
    { titel: 'Beispielstation 1', art: 'pflicht',
      teile: ['Teil 1: Hier steht später der erste Auftrag.', 'Teil 2: Hier steht später der zweite Auftrag.', 'Teil 3: Hier steht später die Sicherung im Heft.'] },
    { titel: 'Beispielstation 2', art: 'pflicht',
      teile: ['Teil 1: Hier steht später der erste Auftrag.', 'Teil 2: Hier steht später der zweite Auftrag.', 'Teil 3: Hier steht später die Sicherung im Heft.'] },
    { titel: 'Beispielstation 3', art: 'wahl', will: 'Ich will üben',
      teile: ['Teil 1: Hier steht später der erste Auftrag.', 'Teil 2: Hier steht später der zweite Auftrag.', 'Teil 3: Hier steht später die Sicherung im Heft.'] },
    { titel: 'Beispielstation 4', art: 'wahl', will: 'Ich will weiterdenken',
      teile: ['Teil 1: Hier steht später der erste Auftrag.', 'Teil 2: Hier steht später der zweite Auftrag.', 'Teil 3: Hier steht später die Sicherung im Heft.'] }
  ]
};

/* ============================================================
   2 · Code: Stand <-> fünf Zeichen
   Stand = { done: Bitmaske erledigter Stationen, cur: laufende Station (1..N, 0 = keine), et: erreichte Etappe }
   ============================================================ */
var Code = (function () {
  // Ohne Zeichen, die man handschriftlich verwechselt (0/O/Q, 1/I/L, S/5, Z/2, B/8, G/6, V/U).
  var ALPHA = 'ACDEFHJKMNPRTUWXY23456789', R = ALPHA.length, LEN = 5, M = Math.pow(R, LEN);
  var ERSATZ = { S: '5', Z: '2', B: '8', G: '6', V: 'U', O: 'D', Q: 'D', '0': 'D' };
  var N = LL.stationen.length, ET = 4;
  var PMAX = Math.pow(2, N) * (N + 1) * ET, C = Math.floor(M / PMAX), A = 7368787;

  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  var SALT = hashStr(LL.id), B = SALT % M;
  function invers(a, m) { var r0 = m, r1 = a % m, t0 = 0, t1 = 1; while (r1) { var q = Math.floor(r0 / r1), r = r0 - q * r1, t = t0 - q * t1; r0 = r1; r1 = r; t0 = t1; t1 = t; } return ((t0 % m) + m) % m; }
  var AINV = invers(A, M);
  function pruef(P) { var h = Math.imul(P ^ SALT, 0x9E3779B1) >>> 0; h ^= h >>> 15; h = Math.imul(h, 0x85EBCA6B) >>> 0; h ^= h >>> 13; return (h >>> 0) % C; }

  function frei(i, done) {              // Darf Station i mit diesem Stand geöffnet werden?
    for (var k = 0; k < N; k++) {
      if (LL.stationen[k].art !== 'pflicht') continue;
      var fertig = (done >> k) & 1;
      if (LL.stationen[i].art === 'wahl' && !fertig) return false;
      if (LL.stationen[i].art === 'pflicht' && k < i && !fertig) return false;
    }
    return true;
  }
  function gueltig(st) {
    if (st.cur < 0 || st.cur > N || st.et < 0) return false;
    for (var i = 0; i < N; i++) {       // erledigte Stationen müssen der Reihenfolge entsprechen
      if ((st.done >> i) & 1) { if (!frei(i, st.done & ~(1 << i))) return false; }
    }
    if (st.cur === 0) return st.et === 0;
    var j = st.cur - 1;
    if ((st.done >> j) & 1) return false;
    if (!frei(j, st.done)) return false;
    return st.et >= 1 && st.et <= LL.stationen[j].teile.length - 1;
  }
  function kanon(st) { return st.et > 0 ? { done: st.done, cur: st.cur, et: st.et } : { done: st.done, cur: 0, et: 0 }; }

  function bilden(stand) {
    var st = kanon(stand);
    var P = st.done + Math.pow(2, N) * (st.cur + (N + 1) * st.et);
    var W = ((P * C + pruef(P)) * A % M + B) % M, s = '';
    for (var i = 0; i < LEN; i++) { s = ALPHA[W % R] + s; W = Math.floor(W / R); }
    return s;
  }
  function saeubern(text) {
    return String(text).toUpperCase().replace(/[^A-Z0-9]/g, '').split('').map(function (c) { return ERSATZ[c] || c; }).join('');
  }
  function lesen(text) {
    var s = saeubern(text);
    if (s.length !== LEN) return null;
    var W = 0;
    for (var i = 0; i < LEN; i++) { var d = ALPHA.indexOf(s[i]); if (d < 0) return null; W = W * R + d; }
    var V = ((W - B + M) % M) * AINV % M, P = Math.floor(V / C);
    if (P >= PMAX || V % C !== pruef(P)) return null;
    var zwei = Math.pow(2, N), rest = Math.floor(P / zwei);
    var st = { done: P % zwei, cur: rest % (N + 1), et: Math.floor(rest / (N + 1)) };
    return gueltig(st) ? st : null;
  }
  return { bilden: bilden, lesen: lesen, saeubern: saeubern, frei: frei, gueltig: gueltig, kanon: kanon, LEN: LEN, N: N };
})();

if (typeof module !== 'undefined') { module.exports = { Code: Code, LL: LL }; }

/* ============================================================
   3 · Oberfläche
   ============================================================ */
if (typeof document !== 'undefined') (function () {
  var SPEICHER = 'll-stand-' + LL.id;
  var stand = { done: 0, cur: 0, et: 0 };
  var sicht = { name: 'karte', fertig: -1, etappeNeu: false, meldung: null };

  try { var roh = JSON.parse(localStorage.getItem(SPEICHER)); if (roh && Code.gueltig(Code.kanon(roh))) stand = roh; } catch (e) {}
  function merken() { try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) {} }

  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function erledigt(i) { return (stand.done >> i) & 1; }
  function leer(st) { return st.done === 0 && Code.kanon(st).cur === 0; }
  function alleFertig() { return stand.done === Math.pow(2, Code.N) - 1; }

  function beschreibe(st) {
    st = Code.kanon(st);
    var t = [];
    LL.stationen.forEach(function (s, i) { if ((st.done >> i) & 1) t.push('Station ' + (i + 1) + ' geschafft'); });
    if (st.cur) t.push('Station ' + st.cur + ' bis Etappe ' + st.et);
    return t.length ? t.join(' · ') : 'Noch nichts geschafft';
  }

  /* ---------- Dialog ---------- */
  function dialog(html) { el('dialogort').innerHTML = '<div class="schleier"><div class="dialog" role="dialog" aria-modal="true">' + html + '</div></div>'; }
  function dialogZu() { el('dialogort').innerHTML = ''; }

  function zeigeCode(titel) {
    if (leer(stand)) {
      dialog('<h3>' + esc(titel) + '</h3><p>Du hast noch keine Etappe erreicht. Es gibt noch nichts zu speichern.</p>' +
             '<div class="reihe"><button data-a="dialogzu">Schließen</button></div>');
      return;
    }
    var k = Code.kanon(stand), wo = k.cur ? 'Station ' + k.cur + ', Teil ' + (k.et + 1) : 'der Übersicht';
    dialog('<h3>' + esc(titel) + '</h3><p>Schreibe diesen Code auf deinen Laufzettel:</p>' +
           '<div class="code">' + Code.bilden(stand) + '</div>' +
           '<p class="klein">Gespeichert: ' + esc(beschreibe(stand)) + '.<br>Mit dem Code startest du wieder bei ' + wo + '.</p>' +
           '<div class="reihe"><button data-a="dialogzu">Aufgeschrieben</button></div>');
  }

  /* ---------- Ansichten ---------- */
  function kopf() {
    var h = '';
    if (sicht.name === 'station') {
      h += '<button class="hell" data-a="karte">‹ Übersicht</button>';
      h += '<h1>Station ' + stand.cur + '<span class="probe">' + esc(LL.stationen[stand.cur - 1].titel) + '</span></h1>';
      h += '<button class="hell" data-a="zwischen">Zwischenstand</button>';
    } else {
      h += '<h1>' + esc(LL.titel) + '<span class="probe">Testfassung 3 · Beispielinhalte</span></h1>';
      if (!leer(stand)) h += '<button class="hell" data-a="meincode">Mein Code</button>';
    }
    el('kopf').innerHTML = h;
  }

  function stationsKarte(i) {
    var s = LL.stationen[i], cls = 'station', lage, aus = '';
    var laeuft = stand.cur === i + 1 && stand.et > 0;
    if (erledigt(i)) { cls += ' erledigt'; lage = 'Geschafft'; aus = ' disabled'; }
    else if (!Code.frei(i, stand.done)) { cls += ' gesperrt'; lage = s.art === 'wahl' ? 'Offen nach den Pflichtstationen' : 'Erst die Station davor'; aus = ' disabled'; }
    else if (laeuft) { cls += ' laeuft'; lage = 'Angefangen · weiter bei Teil ' + (stand.et + 1); }
    else lage = 'Offen';
    return '<button class="' + cls + '" data-a="oeffne" data-i="' + i + '"' + aus + '>' +
           '<span class="nr">' + (erledigt(i) ? '✓' : i + 1) + '</span><span>' +
           (s.will ? '<span class="will">' + esc(s.will) + '</span>' : '') +
           '<span class="titel">' + esc(s.titel) + '</span><span class="lage">' + lage + '</span></span></button>';
  }

  function karte() {
    var h = '';
    if (sicht.meldung) { h += '<div class="hinweis">' + esc(sicht.meldung) + '</div>'; sicht.meldung = null; }
    h += '<div class="karte"><strong>Hast du schon einen Code auf deinem Laufzettel?</strong>' +
         '<div class="reihe" style="margin-top:10px">' +
         '<input class="eingabe" id="codefeld" maxlength="8" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="·····" aria-label="Code vom Laufzettel">' +
         '<button data-a="codeprüfen">Weitermachen</button></div>' +
         '<p class="meldung fehler" id="codemeldung" hidden></p></div>';
    var pflicht = '', wahl = '';
    LL.stationen.forEach(function (s, i) { if (s.art === 'pflicht') pflicht += stationsKarte(i); else wahl += stationsKarte(i); });
    h += '<h2>Pflicht</h2>' + pflicht;
    if (wahl) h += '<h2>Wahl · Such dir aus, was zu dir passt</h2><div class="zwei">' + wahl + '</div>';
    if (alleFertig()) h += '<div class="karte"><p class="gross">Alle Stationen geschafft.</p></div>';
    el('inhalt').innerHTML = h;
    el('fuss').innerHTML = '<button class="text" data-a="neu">Neu anfangen</button>';
  }

  function station() {
    var i = stand.cur - 1, s = LL.stationen[i], n = s.teile.length, h = '<div class="karte">';
    h += '<div class="schritte">';
    for (var k = 0; k < n; k++) h += '<span class="' + (k < stand.et ? 'voll' : k === stand.et ? 'jetzt' : '') + '"></span>';
    h += '</div>';
    if (sicht.etappeNeu) { h += '<div class="hinweis">Etappe ' + stand.et + ' erreicht. Über „Zwischenstand" kannst du sie speichern.</div>'; sicht.etappeNeu = false; }
    h += '<p class="auftrag">' + esc(s.teile[stand.et]) + '</p>';
    h += '<button data-a="weiter">' + (stand.et === n - 1 ? 'Station geschafft' : 'Teil ' + (stand.et + 1) + ' geschafft') + '</button>';
    h += '</div>';
    el('inhalt').innerHTML = h;
    el('fuss').innerHTML = '';
  }

  function fertig() {
    var i = sicht.fertig;
    el('inhalt').innerHTML = '<div class="karte"><p class="gross">Station ' + (i + 1) + ' geschafft!</p>' +
      '<p>Schreibe diesen Code auf deinen Laufzettel, in das Feld von Station ' + (i + 1) + ':</p>' +
      '<div class="code">' + Code.bilden(stand) + '</div>' +
      '<p class="klein">Mit dem Code kommst du in der nächsten Stunde genau hierher zurück, auf jedem iPad.</p>' +
      '<button data-a="karte">Aufgeschrieben · zur Übersicht</button></div>';
    el('fuss').innerHTML = '';
  }

  function zeichne() {
    kopf();
    ({ karte: karte, station: station, fertig: fertig })[sicht.name]();
    window.scrollTo(0, 0);
  }

  /* ---------- Aktionen ---------- */
  function oeffne(i) {
    if (stand.cur !== i + 1) { stand.cur = i + 1; stand.et = 0; }
    sicht.name = 'station'; merken(); zeichne();
  }
  function uebernehme(neu) {
    stand = neu; merken(); dialogZu();
    sicht.meldung = 'Wiederhergestellt: ' + beschreibe(stand) + '.';
    if (stand.cur) { sicht.name = 'station'; sicht.meldung = null; } else sicht.name = 'karte';
    zeichne();
  }
  var wartend = null;

  var aktion = {
    karte: function () { sicht.name = 'karte'; zeichne(); },
    dialogzu: dialogZu,
    meincode: function () { zeigeCode('Mein Code'); },
    zwischen: function () { zeigeCode('Zwischenstand'); },
    oeffne: function (b) {
      var i = +b.dataset.i;
      if (stand.cur && stand.cur !== i + 1 && stand.et > 0) {
        wartend = i;
        dialog('<h3>Station wechseln?</h3><p>Du hast Station ' + stand.cur + ' angefangen. Wenn du wechselst, beginnst du sie später von vorn.</p>' +
               '<div class="reihe"><button class="zweit" data-a="wechseln">Trotzdem wechseln</button><button data-a="zurueck">Bei Station ' + stand.cur + ' bleiben</button></div>');
      } else oeffne(i);
    },
    wechseln: function () { dialogZu(); stand.cur = 0; stand.et = 0; oeffne(wartend); },
    zurueck: function () { dialogZu(); oeffne(stand.cur - 1); },
    weiter: function () {
      var i = stand.cur - 1, n = LL.stationen[i].teile.length;
      if (stand.et === n - 1) { stand.done |= 1 << i; stand.cur = 0; stand.et = 0; sicht.name = 'fertig'; sicht.fertig = i; }
      else { stand.et += 1; sicht.etappeNeu = true; }
      merken(); zeichne();
    },
    'codeprüfen': function () {
      var neu = Code.lesen(el('codefeld').value), m = el('codemeldung');
      if (!neu) { m.textContent = 'Diesen Code gibt es nicht. Vergleiche ihn Zeichen für Zeichen mit deinem Laufzettel.'; m.hidden = false; el('codefeld').focus(); return; }
      if (leer(stand) || Code.bilden(stand) === Code.bilden(neu)) { uebernehme(neu); return; }
      wartend = neu;
      dialog('<h3>Stand ersetzen?</h3><p>Auf diesem iPad: ' + esc(beschreibe(stand)) + '.</p><p>Im Code: ' + esc(beschreibe(neu)) + '.</p>' +
             '<div class="reihe"><button class="zweit" data-a="dialogzu">Abbrechen</button><button data-a="ersetzen">Code übernehmen</button></div>');
    },
    ersetzen: function () { uebernehme(wartend); },
    neu: function () {
      dialog('<h3>Neu anfangen?</h3><p>Der Stand auf diesem iPad wird gelöscht. Mit einem Code vom Laufzettel kommst du zurück.</p>' +
             '<div class="reihe"><button class="zweit" data-a="dialogzu">Abbrechen</button><button data-a="loeschen">Neu anfangen</button></div>');
    },
    loeschen: function () { stand = { done: 0, cur: 0, et: 0 }; merken(); dialogZu(); sicht.name = 'karte'; zeichne(); }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (b && !b.disabled && aktion[b.dataset.a]) aktion[b.dataset.a](b);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'codefeld') aktion['codeprüfen'](); });

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  if (stand.cur && stand.et > 0) sicht.name = 'station'; else { stand.cur = 0; stand.et = 0; }
  zeichne();
})();
</script>
</body>
</html>
